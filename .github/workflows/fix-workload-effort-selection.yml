name: fix-workload-effort-selection

on:
  push:
    branches:
      - feature/workload-aware-allowance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/workload-aware-allowance
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python3 .github/fix-workload-effort-selection.py
      - run: pnpm exec prettier --write apps/cli/src/commands/optimize.ts tests/integration/workload-aware-optimize.test.ts
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/cli/src/commands/optimize.ts tests/integration/workload-aware-optimize.test.ts
          git diff --cached --quiet && exit 1
          git commit -m "fix: preserve quality floor under workload pressure"
          git push origin HEAD:feature/workload-aware-allowance
