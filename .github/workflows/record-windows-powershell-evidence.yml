name: Record Windows PowerShell evidence

on:
  push:
    branches: [fix/windows-powershell-companions-2026-09-05]

permissions:
  contents: write

jobs:
  record:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/windows-powershell-companions-2026-09-05

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: pnpm

      - name: Build Token Harness
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install exact Claude Code build
        shell: pwsh
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.251
          claude --version

      - name: Download exact RTK builds
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\th-live-evidence\rtk'
          New-Item -ItemType Directory -Force -Path "$root\044", "$root\048" | Out-Null
          Invoke-WebRequest 'https://github.com/rtk-ai/rtk/releases/download/v0.44.0/rtk-x86_64-pc-windows-msvc.zip' -OutFile "$root\044.zip"
          Invoke-WebRequest 'https://github.com/rtk-ai/rtk/releases/download/v0.48.0/rtk-x86_64-pc-windows-msvc.zip' -OutFile "$root\048.zip"
          Expand-Archive -Force "$root\044.zip" "$root\044"
          Expand-Archive -Force "$root\048.zip" "$root\048"
          if (-not (Test-Path "$root\044\rtk.exe")) { throw 'RTK 0.44.0 executable missing' }
          if (-not (Test-Path "$root\048\rtk.exe")) { throw 'RTK 0.48.0 executable missing' }
          & "$root\044\rtk.exe" --version
          & "$root\048\rtk.exe" --version

      - name: Record both exact Windows compatibility rows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_WORKSPACE
          $rtkRoot = 'C:\th-live-evidence\rtk'

          function Set-Rtk([string]$version) {
            if ($version -eq '0.44.0') { $dir = "$rtkRoot\044" } else { $dir = "$rtkRoot\048" }
            $env:PATH = "$dir;$script:basePath"
            $reported = (rtk --version | Out-String).Trim()
            if ($reported -notmatch [regex]::Escape($version)) { throw "Expected RTK $version, got $reported" }
          }

          function Reset-World([string]$root) {
            if (Test-Path $root) { Remove-Item -Recurse -Force $root }
            New-Item -ItemType Directory -Force -Path "$root\home", "$root\project" | Out-Null
            return @("$root\home", "$root\project")
          }

          function Write-Brownfield([string]$isolatedHome) {
            New-Item -ItemType Directory -Force -Path "$isolatedHome\.claude" | Out-Null
            @'
          {
            "theme": "dark",
            "hooks": {
              "PreToolUse": [
                {
                  "matcher": "Write|Edit",
                  "hooks": [
                    { "type": "command", "command": "my-own-linter --strict" }
                  ]
                }
              ]
            },
            "permissions": { "allow": ["Read", "Write"] }
          }
          '@ | Set-Content -Encoding utf8 "$isolatedHome\.claude\settings.json"
          }

          function Add-User-Drift([string]$isolatedHome) {
            $file = "$isolatedHome\.claude\settings.json"
            $env:TH_SETTINGS = $file
            node -e "const fs=require('fs'); const p=process.env.TH_SETTINGS; const x=JSON.parse(fs.readFileSync(p,'utf8')); x.hooks.PostToolUse=[{matcher:'Read',hooks:[{type:'command',command:'my-post-hook'}]}]; x.permissions.allow.push('Glob'); fs.writeFileSync(p, JSON.stringify(x,null,2)+'\n')"
            Remove-Item Env:TH_SETTINGS
          }

          function Record-Stage([string]$stage, [string]$isolatedHome, [string]$project, [string]$out) {
            node tests/tools/record-row-fixture.mjs --stage $stage --harness claude --provider rtk --project $project --home $isolatedHome --out $out --reviewed
            if ($LASTEXITCODE -ne 0) { throw "record $stage failed" }
          }

          function Apply-Provisional([string]$operation, [string]$isolatedHome, [string]$project) {
            node tests/tools/apply-with-provisional-row.mjs --operation $operation --harness claude --provider rtk --project $project --home $isolatedHome
            if ($LASTEXITCODE -ne 0) { throw "$operation failed" }
          }

          function Assert-PowerShellHook([string]$version) {
            $payload = '{"hook_event_name":"PreToolUse","tool_name":"PowerShell","tool_input":{"command":"git status"}}'
            $output = $payload | rtk hook claude | Out-String
            if ($LASTEXITCODE -ne 0) { throw "rtk hook claude failed for $version" }
            if ($output -notmatch 'updatedInput') { throw "PowerShell payload was not rewritten by RTK $version. Output: $output" }
            return $output.Trim()
          }

          function Record-Row([string]$providerVersion, [string]$otherVersion, [string]$suffix) {
            Set-Rtk $providerVersion
            $root = "C:\th-live-evidence\world-$suffix"
            $parts = Reset-World $root
            $isolatedHome = $parts[0]
            $project = $parts[1]
            $out = "$repo\tests\fixtures\rows\rtk-claude-windows-2.1.251-$providerVersion"
            if (Test-Path $out) { Remove-Item -Recurse -Force $out }

            Record-Stage 'empty' $isolatedHome $project $out
            Write-Brownfield $isolatedHome
            Record-Stage 'brownfield' $isolatedHome $project $out

            Apply-Provisional 'apply' $isolatedHome $project
            $settings = Get-Content -Raw "$isolatedHome\.claude\settings.json"
            if ($settings -notmatch '"matcher": "Bash"') { throw 'Bash matcher missing after apply' }
            if ($settings -notmatch '"matcher": "PowerShell"') { throw 'PowerShell matcher missing after apply' }
            Record-Stage 'post-apply' $isolatedHome $project $out

            Add-User-Drift $isolatedHome
            Record-Stage 'drift' $isolatedHome $project $out
            Apply-Provisional 'rollback' $isolatedHome $project
            Record-Stage 'rollback' $isolatedHome $project $out

            Apply-Provisional 'apply' $isolatedHome $project
            Add-User-Drift $isolatedHome
            Apply-Provisional 'uninstall' $isolatedHome $project
            $afterUninstall = Get-Content -Raw "$isolatedHome\.claude\settings.json"
            if ($afterUninstall -match 'rtk hook claude') { throw 'uninstall left an RTK hook behind' }
            if ($afterUninstall -notmatch 'my-post-hook') { throw 'uninstall removed user drift' }
            Record-Stage 'uninstall' $isolatedHome $project $out

            Set-Rtk $otherVersion
            Record-Stage 'invalidating-update' $isolatedHome $project $out
            Set-Rtk $providerVersion

            $hook = Assert-PowerShellHook $providerVersion
            @"
          # RTK $providerVersion × Claude Code 2.1.251 on Windows

          Recorded on GitHub Actions `windows-latest` on 2026-09-05 using an isolated home under `C:\th-live-evidence`.

          The recording exercised the real executables and the real Token Harness transaction engine:

          - empty and brownfield configuration capture;
          - provisional managed apply;
          - both `Bash` and `PowerShell` matchers written with `rtk hook claude`;
          - user drift after apply;
          - verified whole-file rollback;
          - a second apply followed by surgical uninstall, preserving the user-added hook;
          - an invalidating provider update to RTK $otherVersion;
          - a direct Claude native-hook payload with `tool_name: PowerShell`, which RTK rewrote successfully.

          The brownfield and drift states are deterministic isolated test states, not copied from a developer home. No credentials or user configuration were present.

          Direct PowerShell-hook output:

          ```json
          $hook
          ```
          "@ | Set-Content -Encoding utf8 "$out\README.md"
          }

          $script:basePath = $env:PATH
          Set-Rtk '0.44.0'
          Assert-PowerShellHook '0.44.0' | Out-Null
          Record-Row '0.44.0' '0.48.0' '044'

          Set-Rtk '0.48.0'
          Assert-PowerShellHook '0.48.0' | Out-Null
          Record-Row '0.48.0' '0.44.0' '048'

          # Validate the 0.48 analytics JSON contract Token Harness consumes.
          $metricsRepo = 'C:\th-live-evidence\metrics-repo'
          New-Item -ItemType Directory -Force -Path $metricsRepo | Out-Null
          Push-Location $metricsRepo
          git init | Out-Null
          git config user.email 'ci@example.invalid'
          git config user.name 'CI'
          'x' | Set-Content x.txt
          git add x.txt
          git commit -m init | Out-Null
          rtk git status | Out-Null
          $gain = rtk gain --all --format json | Out-String
          Pop-Location
          if ($gain.Trim()) {
            $parsed = $gain | ConvertFrom-Json
            if ($null -eq $parsed.summary) { throw 'RTK 0.48.0 gain JSON has no summary' }
          }

      - name: Commit recorded evidence
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/fixtures/rows/rtk-claude-windows-2.1.251-0.44.0 tests/fixtures/rows/rtk-claude-windows-2.1.251-0.48.0
          if (git diff --cached --quiet) { throw 'No compatibility evidence was produced' }
          git commit -m 'test: record live Windows PowerShell compatibility'
          git push origin HEAD:fix/windows-powershell-companions-2026-09-05
