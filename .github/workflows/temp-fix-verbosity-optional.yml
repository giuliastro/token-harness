name: Temp fix verbosity optional

on:
  push:
    branches:
      - feature/verbosity-quality-per-allowance

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/verbosity-quality-per-allowance
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact optional-property fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/cli/src/commands/optimize.ts')
          s = p.read_text()
          old = "    effortLearning,\n    verbosityLearning: verbosityLearning ?? undefined,\n    currentVerbosity: context.verbosity,"
          new = "    effortLearning,\n    ...(verbosityLearning === null ? {} : { verbosityLearning }),\n    currentVerbosity: context.verbosity,"
          if old not in s:
              raise SystemExit('replacement anchor missing')
          p.write_text(s.replace(old, new))
          PY
      - run: pnpm exec prettier --write apps/cli/src/commands/optimize.ts
      - name: Commit fix and remove temporary workflow
        run: |
          git rm .github/workflows/temp-fix-verbosity-optional.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: omit unavailable verbosity learning evidence"
          git push origin HEAD:feature/verbosity-quality-per-allowance
