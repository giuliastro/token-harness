name: Format candidate progress PR
on:
  push:
    branches:
      - feat/candidate-integration-progress-ui
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/candidate-integration-progress-ui
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/cli/test/guided-candidate-readiness-client.test.ts
      - run: rm .github/workflows/format-candidate-progress-pr.yml
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/cli/test/guided-candidate-readiness-client.test.ts .github/workflows/format-candidate-progress-pr.yml
          git diff --cached --quiet || git commit -m "style: apply repository prettier"
          git push origin HEAD:feat/candidate-integration-progress-ui
