name: format-managed-model-guard

on:
  push:
    branches:
      - feature/codex-managed-model-policy

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/codex-managed-model-policy
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write tests/integration/codex-managed-model-guard.test.ts
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/integration/codex-managed-model-guard.test.ts
          git commit -m "style: apply exact Prettier output"
          git push origin HEAD:feature/codex-managed-model-policy
