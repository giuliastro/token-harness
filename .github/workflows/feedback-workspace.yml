name: Feedback workspace
on:
  push:
    branches: [ci/dashboard-feedback]
    paths: [.github/workflows/feedback-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Archive source and public dependencies
        run: tar --exclude='./.git' -czf "$RUNNER_TEMP/feedback-workspace.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: feedback-workspace
          path: ${{ runner.temp }}/feedback-workspace.tar.gz
          retention-days: 1
