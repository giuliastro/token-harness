name: temporary context benchmark patch

on:
  push:
    branches:
      - feature/tool-deferral-benchmark

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/tool-deferral-benchmark
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
      - run: pnpm install --frozen-lockfile
      - name: Apply patch
        run: node scripts/tmp-context-benchmark.mjs
      - name: Format changed product files
        run: pnpm exec prettier --write packages/core/src/domain/benchmark.ts packages/core/src/domain/benchmark-context.ts packages/core/src/index.ts apps/cli/src/commands/benchmark-capture.ts
      - name: Validate
        run: pnpm typecheck && pnpm lint && pnpm test && pnpm build && pnpm package && pnpm smoke:install
      - name: Commit product patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/core/src/domain/benchmark.ts packages/core/src/domain/benchmark-context.ts packages/core/src/index.ts apps/cli/src/commands/benchmark-capture.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: capture context exposure in benchmark receipts"
          git push origin HEAD:feature/tool-deferral-benchmark
