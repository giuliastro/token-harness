name: Align RTK evidence

on:
  push:
    branches: [fix/windows-powershell-companions-2026-09-05]

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/windows-powershell-companions-2026-09-05
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: pnpm
      - name: Align manifest, tests, and Windows companion docs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('packages/adapters/src/providers/rtk.ts')
          s = p.read_text()
          old = """/**
           * The tested range is what has been observed, not what has been proven by a suite. `0.42.0`
           * is the version whose `--format json` output this adapter parses and whose interception
           * the Phase 2.5 spike watched; `0.44.0` is the version spike 9.1 watched intercept OpenCode.
           */"""
          new = """/**
           * The tested range is observation-backed. RTK 0.44.0 and 0.48.0 were exercised with real
           * Windows binaries against Claude Code 2.1.251, including the analytics JSON contract and
           * native Bash/PowerShell hook path. Older RTK builds remain detectable but are deliberately
           * outside the current tested range rather than inheriting PowerShell support by assumption.
           */"""
          if old not in s: raise SystemExit('tested-range comment not found')
          s = s.replace(old, new, 1)

          old = """      // The surface the Phase 2.5 spike actually watched: a `PreToolUse` hook matching
                // `Bash`. `PowerShell` is deliberately absent — the spike ran the identical command
                // through it and RTK's counter did not move, which is the coverage gap `doctor`
                // reports as `tool-family-not-covered`. Claiming it here would make the resolver
                // hand RTK a scope it demonstrably does not serve.
                surfaces: [{ toolFamily: 'Bash', interceptionPoint: 'pre-tool-use' }],
                // RFC 0003 §Rule wants the evidence recorded at a version. The reference is the
                // hook the Phase 2.5 spike read, not a line of RTK's source: what was demonstrated
                // is that the harness routes commands through it, which is the claim being made.
                evidence: {
                  sourceReference: 'docs/spikes/2.5-live-verification-log.md',
                  upstreamVersion: '0.42.0',
                },"""
          new = """      // Windows live evidence now covers both Claude shell families on the same native
                // `PreToolUse` processor. The upstream RTK installer still does not create the PowerShell
                // matcher itself; Token Harness writes that reviewed matcher entry transactionally.
                surfaces: [
                  { toolFamily: 'Bash', interceptionPoint: 'pre-tool-use' },
                  { toolFamily: 'PowerShell', interceptionPoint: 'pre-tool-use' },
                ],
                evidence: {
                  sourceReference:
                    'tests/fixtures/rows/rtk-claude-windows-2.1.251-0.48.0/README.md',
                  upstreamVersion: '0.48.0',
                },"""
          if old not in s: raise SystemExit('first Claude capability block not found')
          s = s.replace(old, new, 1)

          old = """      // Same surface: RTK rewrites the command at `PreToolUse` and the rewritten command is
                // what filters the output, so both capabilities are served from one interception point.
                surfaces: [{ toolFamily: 'Bash', interceptionPoint: 'pre-tool-use' }],
                evidence: {
                  sourceReference: 'docs/spikes/2.5-live-verification-log.md',
                  upstreamVersion: '0.42.0',
                },"""
          new = """      // Same surface: RTK rewrites the command at `PreToolUse` and the rewritten command is
                // what filters the output, so both capabilities are served from the same Bash/PowerShell
                // interception points proven by the Windows recording above.
                surfaces: [
                  { toolFamily: 'Bash', interceptionPoint: 'pre-tool-use' },
                  { toolFamily: 'PowerShell', interceptionPoint: 'pre-tool-use' },
                ],
                evidence: {
                  sourceReference:
                    'tests/fixtures/rows/rtk-claude-windows-2.1.251-0.48.0/README.md',
                  upstreamVersion: '0.48.0',
                },"""
          if old not in s: raise SystemExit('second Claude capability block not found')
          s = s.replace(old, new, 1)

          if "testedVersions: { minimum: '2.0.0', maximum: '2.1.212' }" not in s:
              raise SystemExit('Claude tested version range not found')
          s = s.replace(
              "testedVersions: { minimum: '2.0.0', maximum: '2.1.212' }",
              "testedVersions: { minimum: '2.0.0', maximum: '2.1.251' }",
              1,
          )
          if "const TESTED_VERSIONS = { minimum: '0.40.0', maximum: '0.44.0' };" not in s:
              raise SystemExit('RTK provider tested range not found')
          s = s.replace(
              "const TESTED_VERSIONS = { minimum: '0.40.0', maximum: '0.44.0' };",
              "const TESTED_VERSIONS = { minimum: '0.44.0', maximum: '0.48.0' };",
              1,
          )
          p.write_text(s)

          p = Path('packages/adapters/test/rtk.test.ts')
          s = p.read_text()
          s = s.replace("? 'rtk 0.42.0'", "? 'rtk 0.44.0'", 1)
          s = s.replace("assert.equal(detection.version, '0.42.0');", "assert.equal(detection.version, '0.44.0');", 1)
          anchor = """  it('reports configured when a harness hook names it', async () => {"""
          addition = """  it('accepts the live-validated RTK 0.48.0 build as in range', async () => {
            const detection = await rtkAdapter.detect(context({ version: 'rtk 0.48.0' }));
            assert.equal(detection.version, '0.48.0');
            assert.equal(detection.versionVerdict, 'in-range');
            assert.deepEqual(detection.warnings, []);
          });

          """
          if anchor not in s: raise SystemExit('rtk test anchor not found')
          s = s.replace(anchor, addition + anchor, 1)
          p.write_text(s)

          p = Path('docs/windows-companions.md')
          s = p.read_text()
          old = """The native `rtk hook claude` processor consumes Claude's `tool_input.command`, so Token Harness can
          register the same native hook command for a missing `PowerShell` matcher. This is separate from
          RTK's own installer, whose first-class PowerShell installation/status path is still being tracked
          upstream.

          The change is reviewable and reversible: Token Harness appends only the missing matcher entry to
          Claude's `PreToolUse` hook list and snapshots the settings file before apply."""
          new = """The native `rtk hook claude` processor consumes Claude's `tool_input.command`, so Token Harness can
          register the same native hook command for a missing `PowerShell` matcher. This is separate from
          RTK's own installer, whose first-class PowerShell installation/status path is still being tracked
          upstream.

          Token Harness has live Windows recordings for Claude Code 2.1.251 with both RTK 0.44.0 and RTK
          0.48.0. Those recordings exercise Bash and PowerShell setup, a direct PowerShell hook payload,
          drift, verified rollback, and surgical uninstall. RTK 0.48.0 is therefore inside the current
          tested provider range rather than being treated as an unknown newer build.

          The change is reviewable and reversible: Token Harness appends only the missing matcher entry to
          Claude's `PreToolUse` hook list and snapshots the settings file before apply."""
          if old not in s: raise SystemExit('Windows RTK docs block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          pnpm install --frozen-lockfile
          pnpm format
      - name: Commit and remove this one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/align-rtk-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'feat: align RTK manifest with Windows evidence'
          git push origin HEAD:fix/windows-powershell-companions-2026-09-05
