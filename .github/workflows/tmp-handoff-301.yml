name: Temporary GitNexus handoff patch

on:
  push:
    branches:
      - codex/gitnexus-handoff-after-301
    paths:
      - '.github/workflows/tmp-handoff-301.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/gitnexus-handoff-after-301
          fetch-depth: 1
      - name: Refresh self-stable handoff
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/development-status.md')
          s = p.read_text()
          old = '- Current `main`: `285efc0da16a938be01be26b16855941f8842a91` after PR #300. PR #300 moved only the disposable GitNexus evaluation runtime to Node `22.18.0`; post-merge CI run `35059956531` was fully green on Ubuntu, macOS and Windows, including the GitNexus collector self-test on every platform, Windows RTK live, build, bundle/package and install smoke. The post-merge real-campaign probe installed GitNexus cleanly with no engine warning and then stopped only at the then-missing Claude credential.'
          new = '- Latest GitNexus evaluation-behavior checkpoint: `921c4f0248e500e4da392156c537bd6b2590a5da` after PR #301. PR CI run `35119106660` and post-merge `main` CI run `35119426792` were fully green on Ubuntu, macOS and Windows, including the GitNexus collector self-test on every platform, Windows RTK live, build, bundle/package and install smoke. The real Claude campaign is manual-dispatch-only, defaults to Haiku plus one attempt per variant, and therefore does not consume Claude quota on ordinary pushes or CI. Documentation-only handoffs after this checkpoint do not invalidate it.'
          if old not in s:
              raise SystemExit('expected current-main line not found')
          s = s.replace(old, new, 1)
          old2 = '- The same run exposed an evaluation-runner compatibility issue before authentication: GitNexus `1.6.12` declares Node `^22.18.0 || >=24.11.0`, while the first workflow used the Token Harness CI floor `22.13.0`. Branch `codex/gitnexus-eval-node-runtime` moves **only the disposable real-campaign workflow** to exact Node `22.18.0`; ordinary Token Harness CI/runtime remains on Node `22.13.0`.'
          new2 = '- The same run exposed an evaluation-runner compatibility issue before authentication: GitNexus `1.6.12` declares Node `^22.18.0 || >=24.11.0`, while the first workflow used the Token Harness CI floor `22.13.0`. PR #300 subsequently moved **only the disposable real-campaign workflow** to exact Node `22.18.0`; ordinary Token Harness CI/runtime remains on Node `22.13.0`.'
          if old2 not in s:
              raise SystemExit('expected historical Node line not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/development-status.md
          git diff --cached --check
          git commit -m 'docs: checkpoint quota-safe GitNexus campaign'
          git push origin HEAD:codex/gitnexus-handoff-after-301
