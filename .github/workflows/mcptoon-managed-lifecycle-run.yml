name: mcptoon managed lifecycle runner

on:
  push:
    branches:
      - mcptoon-managed-lifecycle

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply patch carried by bootstrap source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/mcptoon-managed-lifecycle-bootstrap.yml').read_text(encoding='utf-8')
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n\n      - name: Install workspace"
          if start not in source or end not in source:
              raise SystemExit('bootstrap patch block not found')
          block = source.split(start, 1)[1].split(end, 1)[0]
          script = textwrap.dedent(block)

          old_replace = '''def replace(path, old, new):
              p = root / path
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected patch anchor missing in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')'''
          new_replace = '''def replace(path, old, new):
              import re
              p = root / path
              text = p.read_text(encoding='utf-8')
              if old in text:
                  p.write_text(text.replace(old, new, 1), encoding='utf-8')
                  return
              pattern = r'\\n'.join(r'[ \\t]*' + re.escape(line.strip()) for line in old.splitlines())
              match = re.search(pattern, text)
              if match is None:
                  raise SystemExit(f'expected patch anchor missing in {path}: {old[:80]!r}')
              p.write_text(text[:match.start()] + new + text[match.end():], encoding='utf-8')'''
          if old_replace not in script:
              raise SystemExit('replace helper anchor not found in bootstrap patch')
          script = script.replace(old_replace, new_replace, 1)
          script = script.replace(
              "(root / '.github/workflows/mcptoon-managed-lifecycle-bootstrap.yml').unlink()",
              "pass  # temporary workflow is removed later by the GitHub connector",
          )
          exec(compile(script, '<mcptoon-managed-lifecycle-patch>', 'exec'), {})

          candidate_path = Path('apps/cli/src/commands/candidate-lifecycle.ts')
          candidate = candidate_path.read_text(encoding='utf-8')
          candidate = candidate.replace('path: plan.target ?? undefined,', 'path: plan.target ?? null,')
          candidate = candidate.replace(
              'path: verification.target ?? undefined,',
              'path: verification.target ?? null,',
          )
          candidate = candidate.replace(
              'if (!creation.ok) return { fs, failure: creation.diagnostics } as const;',
              'if (!creation.ok) return { ok: false as const, diagnostics: creation.diagnostics };',
          )
          old_success = '''    return {
              fs,
              snapshots: creation.store,
              journal: new FileJournalStore({'''
          new_success = '''    return {
              ok: true as const,
              fs,
              snapshots: creation.store,
              journal: new FileJournalStore({'''
          if old_success not in candidate:
              raise SystemExit('candidate store success anchor not found')
          candidate = candidate.replace(old_success, new_success, 1)
          old_guard = '''if (built === null || !(\'snapshots\' in built)) {
              diagnostics.push(...(built?.failure ?? []));'''
          new_guard = '''if (built === null || !built.ok) {
              diagnostics.push(...(built?.diagnostics ?? []));'''
          if candidate.count(old_guard) != 2:
              raise SystemExit(f'expected two candidate store guards, found {candidate.count(old_guard)}')
          candidate = candidate.replace(old_guard, new_guard)
          candidate_path.write_text(candidate, encoding='utf-8')
          PY

      - name: Install workspace
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            apps/cli/src/commands/candidate-lifecycle.ts \
            apps/cli/src/commands/apply.ts \
            apps/cli/src/commands/rollback.ts \
            apps/cli/src/commands/candidate-benchmark.ts \
            apps/cli/src/usage.ts \
            apps/cli/test/candidate-managed-lifecycle.test.ts \
            apps/cli/test/candidate-benchmark-campaign.test.ts \
            docs/candidates/mcptoon.md \
            docs/development-status.md

      - name: Validate
        run: |
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm lint
          pnpm format:check

      - name: Commit tested patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/cli/src/commands/candidate-lifecycle.ts \
                  apps/cli/src/commands/apply.ts \
                  apps/cli/src/commands/rollback.ts \
                  apps/cli/src/commands/candidate-benchmark.ts \
                  apps/cli/src/usage.ts \
                  apps/cli/test/candidate-managed-lifecycle.test.ts \
                  apps/cli/test/candidate-benchmark-campaign.test.ts \
                  docs/candidates/mcptoon.md \
                  docs/development-status.md
          git commit -m "feat(mcptoon): manage candidate campaign lifecycle"
          git push origin HEAD:mcptoon-managed-lifecycle
