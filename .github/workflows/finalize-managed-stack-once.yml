name: Finalize managed stack once

on:
  push:
    branches:
      - codex/managed-optimization-tools-v2
    paths:
      - .github/workflows/finalize-managed-stack-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/managed-optimization-tools-v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply narrow final fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'apps/cli/src/guided.ts',
              "!['rtk', 'harnesstrim', 'mcptoon', 'gitnexus'].includes(String(data['provider']))",
              "!['rtk', 'harnesstrim', 'mcptoon', 'gitnexus', 'headroom'].includes(String(data['provider']))",
          )
          replace_once(
              'packages/adapters/src/providers/headroom-provider.ts',
              'With your existing uv and Python 3.13 installation, run: uv tool install --python 3.13 --no-python-downloads',
              'With your existing uv and a compatible system Python >=3.10, run: uv tool install --no-managed-python --no-python-downloads',
          )

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace(
              'optimization components it can safely own, keeps experimental candidates separate, verifies the\nresult, and reports savings only when it has evidence to support them.',
              'optimization components it can safely own, keeps evaluation evidence separate from managed lifecycle,\nverifies the result, and reports savings only when it has evidence to support them.',
          )
          text = text.replace(
              '   - Managed optimizers\n   - Experimental tools\n   - Optional agent tuning',
              '   - Managed optimizers\n   - Optional agent tuning',
          )
          text = text.replace(
              'Token Harness also exposes **mcptoon** and **GitNexus** as optional managed integrations on their exact\nreviewed lifecycle rows;',
              'Token Harness also exposes **mcptoon**, **GitNexus** and **Headroom** as optional managed integrations on their exact\nreviewed lifecycle rows;',
          )
          start = text.index('**3. Experimental tools**')
          end = text.index('**4. Optional agent tuning**', start)
          replacement = '''**3. Evaluation evidence (maintainers)**\n\nSelection campaigns and historical candidate evidence remain available for maintainers, but they are\nnot a separate novice setup product. Once a tool has a reviewed managed lifecycle, Setup presents it in\nthe same **Optimization Stack** with its exact state, version, prerequisites, harness scope and safe\nApply/Remove controls. Evaluation evidence never turns into a savings or compatibility claim by itself.\n\nHeadroom is config-only managed on its exact reviewed 0.37.0 row. Token Harness can own the narrow\nClaude Code or Codex MCP registration after the pinned CLI is present; it deliberately does not\nbootstrap `uv`/Python, start wrappers/proxies, or claim runtime compression savings. GitNexus likewise\ndoes not auto-index repositories, and its noncommercial license boundary stays visible.\n\n**4. Optional agent tuning**'''
          text = text[:start] + replacement + text[end + len('**4. Optional agent tuning**'):]
          text = text.replace(
              '| GitNexus | Repository graph / MCP context | Optional managed Claude integration for already-installed 1.6.12; license review required |\n',
              '| GitNexus | Repository graph / MCP context | Optional managed Claude integration for already-installed 1.6.12; license review required |\n| Headroom | Local MCP context compression/retrieval | Optional config-only managed Claude/Codex integration for already-installed 0.37.0; package prerequisite stays user-owned |\n',
          )
          text = text.replace(
              'Current experimental candidates include Headroom, mcptoon and GitNexus. Detection or a promising\nbenchmark is not enough for promotion.',
              'Historical evaluation evidence remains available for mcptoon, GitNexus and Headroom. Detection or a promising\nbenchmark is not enough for a production-stack promotion or savings claim.',
          )
          text = text.replace('### Evaluating an experimental candidate', '### Evaluation evidence (advanced / maintainers)')
          text = text.replace('For normal use, open **Setup -> Experimental tools** and choose **Run standard evaluation**.',
                              'Evaluation campaigns are an advanced maintainer workflow; managed setup stays in the unified **Optimization Stack**.')
          readme.write_text(text)

          status = Path('docs/development-status.md')
          text = status.read_text()
          text = text.replace(
              'its Apache-2.0 package install remains a pinned manual prerequisite through an existing uv + Python 3.13 because uv package absence-restoration is not yet a reviewed transaction path.',
              'its Apache-2.0 package install remains a pinned manual prerequisite through an existing uv plus a compatible system Python >=3.10 because uv package absence-restoration is not yet a reviewed transaction path; the documented command disables uv-managed Python/downloads.',
              1,
          )
          text = text.replace(
              'Current focus: finish the complete Ubuntu/macOS/Windows PR CI (tests, Windows RTK live smoke, build, bundle/package and installed-package smoke), merge only when every job is green, then verify post-merge `main` CI.',
              'Config-contract evidence now confirms Claude Code 2.1.269 and Codex 0.153.0 parse the exact Headroom MCP registrations in an isolated HOME using only local `mcp get` commands; no model prompt, login, API request or benchmark was used. The Headroom package/CLI passive smoke is exercised on Ubuntu, macOS and Windows. Current focus: finish the complete PR CI (tests, Windows RTK live smoke, build, bundle/package and installed-package smoke), merge only when every job is green, then verify post-merge `main` CI.',
              1,
          )
          text = text.replace(
              'RTK + HarnessTrim remain the production baseline. mcptoon and GitNexus expose optional reviewed managed lifecycle without becoming production-stack components; Headroom remains candidate-only.',
              'RTK + HarnessTrim remain the production baseline. mcptoon, GitNexus and Headroom expose optional reviewed managed lifecycle without becoming production-stack components; Headroom package installation remains a user-owned prerequisite.',
              1,
          )
          status.write_text(text)
          PY
      - run: pnpm exec prettier --write apps/cli/src/guided.ts packages/adapters/src/providers/headroom-provider.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-managed-stack-once.yml
          git add apps/cli/src/guided.ts packages/adapters/src/providers/headroom-provider.ts README.md docs/development-status.md
          git diff --cached --check
          git commit -m "fix: finish Headroom managed lifecycle"
          git push origin HEAD:codex/managed-optimization-tools-v2
