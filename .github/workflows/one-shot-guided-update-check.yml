              "      metrics: base?.metrics ?? null,\n      updates:\n        base !== null && this.updates?.fingerprint === base.fingerprint\n          ? this.updates.report.providers\n          : null,\n      unattributedDrift: base?.drift ?? [],",
          )
          replace(
              'apps/cli/src/guided.ts',
              "    this.stackBase = null;\n    this.verification = null;",
              "    this.stackBase = null;\n    this.verification = null;\n    this.updates = null;",
          )
          replace(
              'apps/cli/src/guided.ts',
              "  async verify(): Promise<GuideResult> {",
              "  async checkUpdates(): Promise<GuideResult> {\n    return this.exclusive(async () => {\n      this.record('Checking provider update channels without changing software.', 'working');\n      const messages: string[] = [];\n      const updateResult = await this.call<UpdateReport>(['update']);\n      const inventory = await this.call<DoctorReport>(['doctor']);\n\n      if (inventory.data === null) {\n        this.updates = null;\n        const message =\n          'The current optimizer versions could not be re-read, so update evidence was not attached to the stack. No software changed.';\n        this.record(message, 'attention');\n        return { ok: false, title: 'Update check needs attention', messages: [message], appliedPlans: 0 };\n      }\n\n      const fingerprint = stackFingerprint(inventory.data);\n      this.stackBase = {\n        detections: [...inventory.data.providers],\n        metrics: this.stackBase?.metrics ?? null,\n        drift: this.stackBase?.drift ?? [],\n        fingerprint,\n      };\n\n      if (updateResult.exitCode !== 0 || updateResult.data === null) {\n        this.updates = null;\n        const message = explainGuideIssue(\n          updateResult.diagnostics,\n          'The update channels could not be checked safely. No software changed and no automatic retry was made.',\n        );\n        const stack = this.stackSnapshot();\n        if (this.cached !== null) this.cached.value = { ...this.cached.value, stack };\n        this.record(message, 'attention');\n        return {\n          ok: false,\n          title: 'Update check needs attention',\n          messages: [message],\n          appliedPlans: 0,\n          stack,\n        };\n      }\n\n      this.updates = { fingerprint, report: updateResult.data };\n      const available = updateResult.data.providers.filter((row) => row.verdict === 'upgradable');\n      const blocked = updateResult.data.providers.filter(\n        (row) => row.verdict === 'blocked-unreviewed',\n      );\n      if (available.length > 0) {\n        messages.push(\n          ...available.map(\n            (row) =>\n              `${name(row.providerId)}: ${row.installed ?? 'installed version'} → ${row.available ?? 'new version'} is available. Run token-harness update to review the dry-run; applying still requires explicit approval.`,\n          ),\n        );\n      }\n      if (blocked.length > 0) {\n        messages.push(\n          ...blocked.map(\n            (row) =>\n              `${name(row.providerId)}: ${row.available ?? 'a newer version'} exists, but Token Harness is keeping ${row.installed ?? 'the installed version'} until that combination has reviewed compatibility evidence.`,\n          ),\n        );\n      }\n      if (available.length === 0 && blocked.length === 0)\n        messages.push('No reviewed provider update is currently available. Pins and unavailable channels remain visible in the stack.');\n      messages.push('This was a read-only channel check. No provider was installed, updated, downgraded or enabled.');\n\n      const stack = this.stackSnapshot();\n      if (this.cached !== null) this.cached.value = { ...this.cached.value, stack };\n      this.record('Provider update check completed. No software changed.', 'success');\n      return { ok: true, title: 'Optimizer update check', messages, appliedPlans: 0, stack };\n    });\n  }\n\n  async verify(): Promise<GuideResult> {",
          )

          # HTTP bridge: update only stack lifecycle evidence in the selected cached period.
          http_path = Path('apps/cli/src/guided-http.ts')
          http = http_path.read_text()
          marker = "\nexport function createGuideHandler(input: {"
          if marker not in http:
              raise SystemExit('guided-http.ts: createGuideHandler marker not found')
          merge_fn = r'''
function mergeUpdatedStack(
  cached: GuideOverview['stack'],
  observed: GuideOverview['stack'],
): GuideOverview['stack'] {
  const observedByProvider = new Map(
    observed.components.map((component) => [component.providerId, component]),
  );
  const components = cached.components.map((component) => {
    const current = observedByProvider.get(component.providerId);
    if (current === undefined) return component;
    const detectionChanged =
      component.version !== current.version ||
      component.detectedState !== current.detectedState ||
      component.configured !== current.configured ||
      component.configuredHarnesses.join('\0') !== current.configuredHarnesses.join('\0');
    const verification = detectionChanged ? current.verification : component.verification;
    const health: GuideOverview['stack']['components'][number]['health'] =
      current.health === 'attention' ||
      component.quality.state === 'regressed' ||
      component.conflicts.length > 0
        ? 'attention'
        : current.detectedState === 'configured' && verification === 'verified'
          ? 'healthy'
          : 'unknown';
    const merged: GuideOverview['stack']['components'][number] = {
      ...component,
      detectedState: current.detectedState,
      version: current.version,
      installed: current.installed,
      configured: current.configured,
      configuredHarnesses: [...current.configuredHarnesses],
      managedByTokenHarness: current.managedByTokenHarness,
      verification,
      health,
      update: current.update,
      updateAvailableVersion: current.updateAvailableVersion,
      warnings: [...current.warnings],
    };
    return { ...merged, nextAction: stackNextAction(merged) };
  });
  const present = components.filter((component) => component.detectedState !== 'absent');
  const state: GuideOverview['stack']['state'] =
    present.length === 0
      ? 'empty'
      : present.some((component) => component.health === 'attention') ||
          cached.unattributedDrift.length > 0
        ? 'attention'
        : present.every(
              (component) =>
                component.health === 'healthy' &&
                component.nextAction === null &&
                (component.update === 'current' || component.update === 'pinned'),
            )
          ? 'healthy'
          : 'incomplete';
  return { components, unattributedDrift: [...cached.unattributedDrift], state };
}
'''
          http = http.replace(marker, '\n' + merge_fn + marker, 1)
          endpoint_marker = "      if (url.pathname === '/api/verify') {"
          if http.count(endpoint_marker) != 1:
              raise SystemExit('guided-http.ts: verify endpoint marker mismatch')
          endpoint = r'''      if (url.pathname === '/api/update-check') {
        if (body === null || typeof body !== 'object' || Array.isArray(body))
          throw new GuideError(400, 'Only an optional reporting period is accepted.');
        const data = body as Record<string, unknown>;
        if (
          Object.keys(data).some((key) => key !== 'period') ||
          (data['period'] !== undefined && !['all', '7d', '30d'].includes(String(data['period'])))
        )
          throw new GuideError(400, 'Only an optional reporting period is accepted.');
        const result = await input.service.checkUpdates();
        const requested = data['period'] as GuidePeriod | undefined;
        let responseResult = result;
        if (result.stack !== undefined && requested !== undefined) {
          const cached = overviewCache.get(requested);
          if (cached !== undefined) {
            const overview = JSON.parse(cached.body) as GuideOverview;
            const stack = mergeUpdatedStack(overview.stack, result.stack);
            overviewCache.set(requested, {
              ...cached,
              body: JSON.stringify({ ...overview, stack }),
            });
            responseResult = { ...result, stack };
          }
        }
        // Update discovery is intentionally on-demand and read-only. Keep all other period-specific
        // evidence hot; only the stack update/version fields are replaced.
        send(200, JSON.stringify(responseResult));
        return;
      }
'''
          http = http.replace(endpoint_marker, endpoint + endpoint_marker, 1)
          http_path.write_text(http)

          # Put the control next to the product object it observes.
          replace(
