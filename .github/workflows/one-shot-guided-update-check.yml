name: One-shot guided update check

on:
  push:
    branches: [feat/guided-update-check]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/guided-update-check
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: pnpm
      - name: Apply product slice
        run: python3 scripts/one-shot-guided-update-check.py
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Commit validated slice and remove staging files
        shell: bash
        run: |
          rm .github/workflows/one-shot-guided-update-check.yml scripts/one-shot-guided-update-check.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add guided optimizer update checks"
          git push origin HEAD:feat/guided-update-check
