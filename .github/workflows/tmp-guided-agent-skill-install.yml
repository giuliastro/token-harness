name: tmp-guided-agent-skill-install

on:
  push:
    branches:
      - feature/guided-agent-skill-install

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/guided-agent-skill-install
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node .tmp-guided-agent-skill-install.mjs
      - run: node .tmp-fix-guided-agent-skill-finalizer.mjs
      - run: >-
          pnpm exec prettier --write
          apps/cli/src/agent-skill.ts
          apps/cli/src/argv.ts
          apps/cli/src/commands/context.ts
          apps/cli/src/commands/plan.ts
          apps/cli/src/commands/apply.ts
          apps/cli/src/run.ts
          apps/cli/src/guided.ts
          apps/cli/src/guided-client.ts
          apps/cli/src/guided-assets.ts
          apps/cli/test/agent-skill-install.test.ts
          apps/cli/test/agent-skill-argv.test.ts
          apps/cli/test/guided-agent-skill.test.ts
          apps/cli/test/guided-loading-layout.test.ts
          tests/integration/agent-skill.test.ts
          docs/rfcs/0023-guided-agent-skill-install.md
          README.md
          PLAN.md
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm package
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: enable guided in-session Token Harness"
            git push origin HEAD:feature/guided-agent-skill-install
          fi
