name: Format debug

on:
  push:
    branches:
      - codex/refresh-provider-versions-2026-09

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format target files
        run: pnpm exec prettier --write packages/adapters/src/providers/provider-version-policy.ts packages/adapters/test/provider-version-policy.test.ts
      - name: Show exact diff
        run: git diff -- packages/adapters/src/providers/provider-version-policy.ts packages/adapters/test/provider-version-policy.test.ts
