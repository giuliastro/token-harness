name: Format debug

on:
  push:
    branches:
      - codex/provider-tool-updates-2026-09-12

permissions:
  contents: read

jobs:
  prettier-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository formatter
        run: pnpm exec prettier --write apps/cli/src/commands/update.ts packages/adapters/test/version-compatibility.test.ts packages/core/src/state/install.ts
      - uses: actions/upload-artifact@v4
        with:
          name: prettier-output
          path: |
            apps/cli/src/commands/update.ts
            packages/adapters/test/version-compatibility.test.ts
            packages/core/src/state/install.ts
