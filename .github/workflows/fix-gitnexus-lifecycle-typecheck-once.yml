name: Fix GitNexus lifecycle typecheck once

on:
  push:
    branches:
      - codex/gitnexus-managed-campaign-lifecycle
    paths:
      - .github/workflows/fix-gitnexus-lifecycle-typecheck-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/gitnexus-managed-campaign-lifecycle

      - name: Apply exact type-narrowing patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/cli/src/commands/gitnexus-candidate-lifecycle.ts')
          text = path.read_text()

          assert text.count('context.harness,') == 2
          assert text.count('planGitNexusManagedMcpActivation(provider, context.harness)') == 1
          assert text.count('journal: built.journal,') == 2

          text = text.replace('context.harness,', 'context.harness!,')
          text = text.replace(
              'planGitNexusManagedMcpActivation(provider, context.harness)',
              'planGitNexusManagedMcpActivation(provider, context.harness!)',
          )
          text = text.replace('journal: built.journal,', 'journal: built.journal as FileJournalStore,')
          path.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cli/src/commands/gitnexus-candidate-lifecycle.ts
          git diff --cached --check
          git commit -m "fix(gitnexus): narrow managed lifecycle types"
          git push origin HEAD:codex/gitnexus-managed-campaign-lifecycle
