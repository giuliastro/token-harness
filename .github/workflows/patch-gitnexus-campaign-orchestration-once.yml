name: Patch GitNexus campaign orchestration once

on:
  push:
    branches:
      - codex/gitnexus-managed-campaign-orchestration
    paths:
      - .github/workflows/patch-gitnexus-campaign-orchestration-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/gitnexus-managed-campaign-orchestration

      - name: Patch planner and behavioral coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          src = Path('apps/cli/src/commands/candidate-benchmark.ts')
          text = src.read_text()

          old = '''    return {
              command:
                definition.candidateId === 'mcptoon'
                  ? `token-harness uninstall --candidate mcptoon --harness ${definition.harnessId} --yes && ${start}`
                  : start,
              instruction:
                definition.candidateId === 'mcptoon'
                  ? `Token Harness first deactivates only its own mcptoon guidance, then starts baseline ${String(next.run)} for ${next.taskClass}. The reviewed mcptoon binary may stay installed but is inactive for the baseline.`
                  : `Start baseline ${String(next.run)} for ${next.taskClass} with the current production stack unchanged.`,
            };'''
          new = '''    return {
              command:
                definition.candidateId === 'mcptoon'
                  ? `token-harness uninstall --candidate mcptoon --harness ${definition.harnessId} --yes && ${start}`
                  : definition.candidateId === 'gitnexus' && definition.harnessId === 'claude'
                    ? `token-harness uninstall --candidate gitnexus --harness claude --yes && ${start}`
                    : start,
              instruction:
                definition.candidateId === 'mcptoon'
                  ? `Token Harness first deactivates only its own mcptoon guidance, then starts baseline ${String(next.run)} for ${next.taskClass}. The reviewed mcptoon binary may stay installed but is inactive for the baseline.`
                  : definition.candidateId === 'gitnexus' && definition.harnessId === 'claude'
                    ? `Token Harness first removes only its owned GitNexus Claude MCP entry, then starts baseline ${String(next.run)} for ${next.taskClass}. The reviewed GitNexus binary stays user-installed but is inactive for the baseline.`
                    : `Start baseline ${String(next.run)} for ${next.taskClass} with the current production stack unchanged.`,
            };'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''    return {
              command:
                definition.candidateId === 'mcptoon'
                  ? `token-harness apply --candidate mcptoon --harness ${definition.harnessId} --yes && ${start}`
                  : start,
              instruction:
                definition.candidateId === 'mcptoon'
                  ? 'Token Harness installs the exact reviewed mcptoon build when absent, activates only its owned guidance, then starts the optimized capture. Candidate activity is still verified independently inside the task window.'
                  : `Enable ${definition.candidateId} through its own documented workflow first, then start the optimized capture. Token Harness does not claim activation itself.`,
            };'''
          new = '''    return {
              command:
                definition.candidateId === 'mcptoon'
                  ? `token-harness apply --candidate mcptoon --harness ${definition.harnessId} --yes && ${start}`
                  : definition.candidateId === 'gitnexus' && definition.harnessId === 'claude'
                    ? `token-harness apply --candidate gitnexus --harness claude --yes && ${start}`
                    : start,
              instruction:
                definition.candidateId === 'mcptoon'
                  ? 'Token Harness installs the exact reviewed mcptoon build when absent, activates only its owned guidance, then starts the optimized capture. Candidate activity is still verified independently inside the task window.'
                  : definition.candidateId === 'gitnexus' && definition.harnessId === 'claude'
                    ? 'Token Harness registers only its owned Claude MCP entry for the already-installed exact reviewed GitNexus build, then starts the optimized capture. It does not install or index anything; runtime activation is still verified independently at task boundaries.'
                    : `Enable ${definition.candidateId} through its own documented workflow first, then start the optimized capture. Token Harness does not claim activation itself.`,
            };'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''  return {
            command:
              definition.candidateId === 'mcptoon'
                ? `${finish} && token-harness uninstall --candidate mcptoon --harness ${definition.harnessId} --yes`
                : finish,
            instruction:
              definition.candidateId === 'mcptoon'
                ? 'Finish the optimized task, preserving its activation witness first, then let Token Harness remove only its owned mcptoon guidance. Change quality/attempt counts if the observed outcome differs from the default command.'
                : 'Finish the optimized task. Change quality/attempt counts if the observed outcome differs from the default command.',
          };'''
          new = '''  return {
            command:
              definition.candidateId === 'mcptoon'
                ? `${finish} && token-harness uninstall --candidate mcptoon --harness ${definition.harnessId} --yes`
                : definition.candidateId === 'gitnexus' && definition.harnessId === 'claude'
                  ? `${finish} && token-harness uninstall --candidate gitnexus --harness claude --yes`
                  : finish,
            instruction:
              definition.candidateId === 'mcptoon'
                ? 'Finish the optimized task, preserving its activation witness first, then let Token Harness remove only its owned mcptoon guidance. Change quality/attempt counts if the observed outcome differs from the default command.'
                : definition.candidateId === 'gitnexus' && definition.harnessId === 'claude'
                  ? 'Finish the optimized task first so its GitNexus boundary witness is preserved, then let Token Harness remove only its owned Claude MCP entry. Change quality/attempt counts if the observed outcome differs from the default command.'
                  : 'Finish the optimized task. Change quality/attempt counts if the observed outcome differs from the default command.',
          };'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          src.write_text(text)

          test = Path('apps/cli/test/candidate-benchmark-campaign.test.ts')
          text = test.read_text()
          assert text.count('  harnessId,\n  type FileStat,') == 1
          text = text.replace('  harnessId,\n  type FileStat,', '  harnessId,\n  type FileStat,\n  type HarnessId,')
          assert text.count("const CODEX = harnessId('codex');") == 1
          text = text.replace("const CODEX = harnessId('codex');", "const CODEX = harnessId('codex');\nconst CLAUDE = harnessId('claude');")

          assert text.count("  taskClass: TaskClass,\n): TaskBenchmarkCapture {") == 1
          text = text.replace(
              "  taskClass: TaskClass,\n): TaskBenchmarkCapture {",
              "  taskClass: TaskClass,\n  harness: HarnessId = CODEX,\n): TaskBenchmarkCapture {",
          )
          assert text.count('    harnessId: CODEX,') == 2
          text = text.replace('    harnessId: CODEX,', '    harnessId: harness,', 1)

          assert text.count("  taskClass: TaskClass,\n): TaskBenchmarkReceipt {") == 1
          text = text.replace(
              "  taskClass: TaskClass,\n): TaskBenchmarkReceipt {",
              "  taskClass: TaskClass,\n  harness: HarnessId = CODEX,\n): TaskBenchmarkReceipt {",
          )
          assert text.count('    harnessId: CODEX,') == 1
          text = text.replace('    harnessId: CODEX,', '    harnessId: harness,', 1)

          assert text.count('function fixture() {') == 1
          text = text.replace('function fixture() {', 'function fixture(harness: HarnessId = CODEX) {')
          text = text.replace(
              "JSON.stringify(capture(benchmarkId, 'baseline', taskClass)),",
              "JSON.stringify(capture(benchmarkId, 'baseline', taskClass, harness)),",
          )
          text = text.replace(
              "JSON.stringify(receipt(benchmarkId, 'baseline', taskClass))",
              "JSON.stringify(receipt(benchmarkId, 'baseline', taskClass, harness))",
          )

          old = '''  function addOptimized(benchmarkId: string, taskClass: TaskClass): void {
              const dir = ensureBenchmark(benchmarkId);
              files.set(
                `${dir}/optimized.capture.json`,
                JSON.stringify(capture(benchmarkId, 'optimized', taskClass)),
              );
              files.set(
                `${dir}/optimized.json`,
                JSON.stringify(receipt(benchmarkId, 'optimized', taskClass)),
              );
            }'''
          new = '''  function addOptimizedCapture(benchmarkId: string, taskClass: TaskClass): void {
              const dir = ensureBenchmark(benchmarkId);
              files.set(
                `${dir}/optimized.capture.json`,
                JSON.stringify(capture(benchmarkId, 'optimized', taskClass, harness)),
              );
            }

            function addOptimized(benchmarkId: string, taskClass: TaskClass): void {
              const dir = ensureBenchmark(benchmarkId);
              addOptimizedCapture(benchmarkId, taskClass);
              files.set(
                `${dir}/optimized.json`,
                JSON.stringify(receipt(benchmarkId, 'optimized', taskClass, harness)),
              );
            }'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          assert text.count('    harness: CODEX,') == 1
          text = text.replace('    harness: CODEX,', '    harness,')
          assert text.count('  return { addBaseline, addOptimized, attribute, context };') == 1
          text = text.replace(
              '  return { addBaseline, addOptimized, attribute, context };',
              '  return { addBaseline, addOptimized, addOptimizedCapture, attribute, context };',
          )

          marker = '''  it('resumes after a completed baseline and requires external activation before optimized', async () => {'''
          assert text.count(marker) == 1
          added = '''  it('deactivates owned GitNexus before a Claude baseline', async () => {
              const world = fixture(CLAUDE);
              const result = await runCandidateBenchmarkMatrix(world.context());
              assert.equal(result.exitCode, 0);
              assert.ok(result.data?.campaign);
              assert.match(
                result.data.campaign.nextCommand ?? '',
                /token-harness uninstall --candidate gitnexus --harness claude --yes && token-harness benchmark-start/,
              );
              assert.match(result.data.campaign.nextCommand ?? '', /--variant baseline/);
              assert.match(result.data.campaign.nextInstruction, /owned GitNexus Claude MCP entry/);
            });

            it('uses Token Harness itself to activate GitNexus before a Claude optimized pair', async () => {
              const world = fixture(CLAUDE);
              world.addBaseline('gitnexus-eval-m-1', 'mechanical');

              const result = await runCandidateBenchmarkMatrix(world.context());
              assert.equal(result.exitCode, 0);
              assert.ok(result.data?.campaign);
              assert.equal(result.data.campaign.slots[0]?.state, 'optimized-not-started');
              assert.match(
                result.data.campaign.nextCommand ?? '',
                /token-harness apply --candidate gitnexus --harness claude --yes && token-harness benchmark-start/,
              );
              assert.match(result.data.campaign.nextCommand ?? '', /--variant optimized/);
              assert.doesNotMatch(result.data.campaign.nextInstruction, /documented workflow first/);
              assert.match(result.data.campaign.nextInstruction, /does not install or index anything/);
            });

            it('finishes a Claude optimized capture before removing only owned GitNexus state', async () => {
              const world = fixture(CLAUDE);
              world.addBaseline('gitnexus-eval-m-1', 'mechanical');
              world.addOptimizedCapture('gitnexus-eval-m-1', 'mechanical');

              const result = await runCandidateBenchmarkMatrix(world.context());
              assert.equal(result.exitCode, 0);
              assert.ok(result.data?.campaign);
              assert.equal(result.data.campaign.slots[0]?.state, 'optimized-running');
              assert.match(
                result.data.campaign.nextCommand ?? '',
                /benchmark-finish.*--variant optimized.*&& token-harness uninstall --candidate gitnexus --harness claude --yes/,
              );
              assert.match(result.data.campaign.nextInstruction, /boundary witness is preserved/);
            });

          '''
          text = text.replace(marker, added + marker)
          test.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cli/src/commands/candidate-benchmark.ts apps/cli/test/candidate-benchmark-campaign.test.ts
          git diff --cached --check
          git commit -m "feat(gitnexus): orchestrate reviewed Claude campaign lifecycle"
          git push origin HEAD:codex/gitnexus-managed-campaign-orchestration
