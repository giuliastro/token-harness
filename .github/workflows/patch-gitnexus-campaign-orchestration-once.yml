name: Patch GitNexus campaign orchestration once

on:
  push:
    branches:
      - codex/gitnexus-managed-campaign-orchestration
    paths:
      - .github/workflows/patch-gitnexus-campaign-orchestration-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/gitnexus-managed-campaign-orchestration

      - name: Patch planner and behavioral coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def one_index(lines, fragment):
              hits = [i for i, line in enumerate(lines) if fragment in line]
              assert len(hits) == 1, (fragment, hits)
              return hits[0]

          src = Path('apps/cli/src/commands/candidate-benchmark.ts')
          lines = src.read_text().splitlines()

          i = one_index(lines, '? `token-harness uninstall --candidate mcptoon --harness ${definition.harnessId} --yes && ${start}`')
          assert lines[i + 1].strip() == ': start,'
          indent = lines[i + 1][:-len(lines[i + 1].lstrip())]
          lines[i + 1:i + 2] = [
              indent + ": definition.candidateId === 'gitnexus' && definition.harnessId === 'claude'",
              indent + '  ? `token-harness uninstall --candidate gitnexus --harness claude --yes && ${start}`',
              indent + '  : start,',
          ]

          i = one_index(lines, 'Token Harness first deactivates only its own mcptoon guidance')
          assert lines[i + 1].strip().startswith(': `Start baseline ')
          indent = lines[i + 1][:-len(lines[i + 1].lstrip())]
          original = lines[i + 1].strip()[2:]
          lines[i + 1:i + 2] = [
              indent + ": definition.candidateId === 'gitnexus' && definition.harnessId === 'claude'",
              indent + '  ? `Token Harness first removes only its owned GitNexus Claude MCP entry, then starts baseline ${String(next.run)} for ${next.taskClass}. The reviewed GitNexus binary stays user-installed but is inactive for the baseline.`',
              indent + '  : ' + original,
          ]

          i = one_index(lines, '? `token-harness apply --candidate mcptoon --harness ${definition.harnessId} --yes && ${start}`')
          assert lines[i + 1].strip() == ': start,'
          indent = lines[i + 1][:-len(lines[i + 1].lstrip())]
          lines[i + 1:i + 2] = [
              indent + ": definition.candidateId === 'gitnexus' && definition.harnessId === 'claude'",
              indent + '  ? `token-harness apply --candidate gitnexus --harness claude --yes && ${start}`',
              indent + '  : start,',
          ]

          i = one_index(lines, 'Token Harness installs the exact reviewed mcptoon build when absent')
          assert 'documented workflow first' in lines[i + 1]
          indent = lines[i + 1][:-len(lines[i + 1].lstrip())]
          original = lines[i + 1].strip()[2:]
          lines[i + 1:i + 2] = [
              indent + ": definition.candidateId === 'gitnexus' && definition.harnessId === 'claude'",
              indent + "  ? 'Token Harness registers only its owned Claude MCP entry for the already-installed exact reviewed GitNexus build, then starts the optimized capture. It does not install or index anything; runtime activation is still verified independently at task boundaries.'",
              indent + '  : ' + original,
          ]

          i = one_index(lines, '? `${finish} && token-harness uninstall --candidate mcptoon --harness ${definition.harnessId} --yes`')
          assert lines[i + 1].strip() == ': finish,'
          indent = lines[i + 1][:-len(lines[i + 1].lstrip())]
          lines[i + 1:i + 2] = [
              indent + ": definition.candidateId === 'gitnexus' && definition.harnessId === 'claude'",
              indent + '  ? `${finish} && token-harness uninstall --candidate gitnexus --harness claude --yes`',
              indent + '  : finish,',
          ]

          i = one_index(lines, 'Finish the optimized task, preserving its activation witness first')
          assert 'Finish the optimized task. Change quality/attempt counts' in lines[i + 1]
          indent = lines[i + 1][:-len(lines[i + 1].lstrip())]
          original = lines[i + 1].strip()[2:]
          lines[i + 1:i + 2] = [
              indent + ": definition.candidateId === 'gitnexus' && definition.harnessId === 'claude'",
              indent + "  ? 'Finish the optimized task first so its GitNexus boundary witness is preserved, then let Token Harness remove only its owned Claude MCP entry. Change quality/attempt counts if the observed outcome differs from the default command.'",
              indent + '  : ' + original,
          ]
          src.write_text('\n'.join(lines) + '\n')

          test = Path('apps/cli/test/candidate-benchmark-campaign.test.ts')
          lines = test.read_text().splitlines()

          i = one_index(lines, 'type FileStat,')
          assert 'type HarnessId,' not in lines
          lines.insert(i + 1, '  type HarnessId,')

          i = one_index(lines, "const CODEX = harnessId('codex');")
          lines.insert(i + 1, "const CLAUDE = harnessId('claude');")

          for function_name, return_type in [
              ('function capture(', 'TaskBenchmarkCapture'),
              ('function receipt(', 'TaskBenchmarkReceipt'),
          ]:
              start = one_index(lines, function_name)
              end = next(j for j in range(start, len(lines)) if lines[j].strip() == f'): {return_type} {{')
              task = next(j for j in range(start, end) if lines[j].strip() == 'taskClass: TaskClass,')
              lines.insert(task + 1, '  harness: HarnessId = CODEX,')
              end += 1
              hid = next(j for j in range(end, len(lines)) if lines[j].strip() == 'harnessId: CODEX,')
              lines[hid] = lines[hid].replace('harnessId: CODEX,', 'harnessId: harness,')

          i = one_index(lines, 'function fixture() {')
          lines[i] = lines[i].replace('function fixture() {', 'function fixture(harness: HarnessId = CODEX) {')

          for idx, line in enumerate(lines):
              if "JSON.stringify(capture(benchmarkId, 'baseline', taskClass))," in line:
                  lines[idx] = line.replace("taskClass)),", "taskClass, harness)),")
              if "JSON.stringify(receipt(benchmarkId, 'baseline', taskClass))" in line:
                  lines[idx] = line.replace("taskClass))", "taskClass, harness))")

          start = one_index(lines, 'function addOptimized(benchmarkId: string, taskClass: TaskClass): void {')
          end = next(j for j in range(start + 1, len(lines)) if lines[j].startswith('  const context ='))
          replacement = [
              '  function addOptimizedCapture(benchmarkId: string, taskClass: TaskClass): void {',
              '    const dir = ensureBenchmark(benchmarkId);',
              '    files.set(',
              '      `${dir}/optimized.capture.json`,',
              "      JSON.stringify(capture(benchmarkId, 'optimized', taskClass, harness)),",
              '    );',
              '  }',
              '',
              '  function addOptimized(benchmarkId: string, taskClass: TaskClass): void {',
              '    const dir = ensureBenchmark(benchmarkId);',
              '    addOptimizedCapture(benchmarkId, taskClass);',
              '    files.set(',
              '      `${dir}/optimized.json`,',
              "      JSON.stringify(receipt(benchmarkId, 'optimized', taskClass, harness)),",
              '    );',
              '  }',
              '',
          ]
          lines[start:end] = replacement

          i = one_index(lines, 'harness: CODEX,')
          lines[i] = lines[i].replace('harness: CODEX,', 'harness,')

          i = one_index(lines, 'return { addBaseline, addOptimized, attribute, context };')
          lines[i] = lines[i].replace(
              'return { addBaseline, addOptimized, attribute, context };',
              'return { addBaseline, addOptimized, addOptimizedCapture, attribute, context };',
          )

          marker = "  it('resumes after a completed baseline and requires external activation before optimized', async () => {"
          i = one_index(lines, marker)
          added = [
              "  it('deactivates owned GitNexus before a Claude baseline', async () => {",
              '    const world = fixture(CLAUDE);',
              '    const result = await runCandidateBenchmarkMatrix(world.context());',
              '    assert.equal(result.exitCode, 0);',
              '    assert.ok(result.data?.campaign);',
              '    assert.match(',
              "      result.data.campaign.nextCommand ?? '',",
              '      /token-harness uninstall --candidate gitnexus --harness claude --yes && token-harness benchmark-start/,',
              '    );',
              "    assert.match(result.data.campaign.nextCommand ?? '', /--variant baseline/);",
              '    assert.match(result.data.campaign.nextInstruction, /owned GitNexus Claude MCP entry/);',
              '  });',
              '',
              "  it('uses Token Harness itself to activate GitNexus before a Claude optimized pair', async () => {",
              '    const world = fixture(CLAUDE);',
              "    world.addBaseline('gitnexus-eval-m-1', 'mechanical');",
              '',
              '    const result = await runCandidateBenchmarkMatrix(world.context());',
              '    assert.equal(result.exitCode, 0);',
              '    assert.ok(result.data?.campaign);',
              "    assert.equal(result.data.campaign.slots[0]?.state, 'optimized-not-started');",
              '    assert.match(',
              "      result.data.campaign.nextCommand ?? '',",
              '      /token-harness apply --candidate gitnexus --harness claude --yes && token-harness benchmark-start/,',
              '    );',
              "    assert.match(result.data.campaign.nextCommand ?? '', /--variant optimized/);",
              '    assert.doesNotMatch(result.data.campaign.nextInstruction, /documented workflow first/);',
              '    assert.match(result.data.campaign.nextInstruction, /does not install or index anything/);',
              '  });',
              '',
              "  it('finishes a Claude optimized capture before removing only owned GitNexus state', async () => {",
              '    const world = fixture(CLAUDE);',
              "    world.addBaseline('gitnexus-eval-m-1', 'mechanical');",
              "    world.addOptimizedCapture('gitnexus-eval-m-1', 'mechanical');",
              '',
              '    const result = await runCandidateBenchmarkMatrix(world.context());',
              '    assert.equal(result.exitCode, 0);',
              '    assert.ok(result.data?.campaign);',
              "    assert.equal(result.data.campaign.slots[0]?.state, 'optimized-running');",
              '    assert.match(',
              "      result.data.campaign.nextCommand ?? '',",
              '      /benchmark-finish.*--variant optimized.*&& token-harness uninstall --candidate gitnexus --harness claude --yes/,',
              '    );',
              '    assert.match(result.data.campaign.nextInstruction, /boundary witness is preserved/);',
              '  });',
              '',
          ]
          lines[i:i] = added
          test.write_text('\n'.join(lines) + '\n')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cli/src/commands/candidate-benchmark.ts apps/cli/test/candidate-benchmark-campaign.test.ts
          git diff --cached --check
          git commit -m "feat(gitnexus): orchestrate reviewed Claude campaign lifecycle"
          git push origin HEAD:codex/gitnexus-managed-campaign-orchestration
