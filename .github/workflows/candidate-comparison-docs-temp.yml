name: Temporary candidate comparison docs and formatting

on:
  push:
    branches: [feat/candidate-campaign-comparison]
    paths:
      - .github/workflows/candidate-comparison-docs-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/candidate-campaign-comparison
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Update product documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text()
          old = '''A campaign selection assessment can report `insufficient-evidence`, `promising`, `mixed` or
          `negative`, plus whether the evidence is decision-ready. **Decision-ready is not promotion-ready.**
          Activation verification, managed lifecycle, compatibility/reversibility, project maturity and
          combined-stack validation remain separate gates.
          '''
          new = '''A campaign selection assessment can report `insufficient-evidence`, `promising`, `mixed` or
          `negative`, plus whether the evidence is decision-ready. **Decision-ready is not promotion-ready.**
          The campaign shows the same promotion-review gate count and next gate as the candidate card, using
          the current local observation rather than starting another environment scan. Activation
          verification, managed lifecycle, compatibility/reversibility, project maturity and combined-stack
          validation remain separate gates.

          Choose **Compare evaluation evidence** when you want one read-only view of campaigns you already
          started. The comparison is loaded only on request, never creates a campaign, keeps candidate and
          harness ordering fixed, and reports progress, selection signal, decision readiness and promotion
          gates without producing a composite score or automatic winner.
          '''
          if old not in text:
              raise SystemExit('README candidate paragraph not found')
          readme.write_text(text.replace(old, new, 1))

          priorities = Path('docs/optimizer-priorities.md')
          text = priorities.read_text()
          old = '''The candidate evidence view deliberately emits **no composite score, winner, activation decision or
          promotion recommendation**. Promotion remains a separate product decision that also requires
          compatibility, distinctness, operational cost, verification and reversibility evidence.
          '''
          new = '''The candidate evidence view deliberately emits **no composite score, winner, activation decision or
          promotion recommendation**. Promotion remains a separate product decision that also requires
          compatibility, distinctness, operational cost, verification and reversibility evidence.

          The guided campaign now projects that selection evidence through the same promotion-readiness gates
          shown on the candidate card. An explicit **Compare evaluation evidence** action can read only saved
          candidate/harness campaigns and place their progress, selection signal, decision readiness and gate
          state side by side. It is intentionally on-demand, does not create missing campaigns or trigger a
          second environment scan, and preserves fixed candidate/harness ordering instead of ranking by a
          synthetic score.
          '''
          if old not in text:
              raise SystemExit('optimizer-priorities candidate paragraph not found')
          priorities.write_text(text.replace(old, new, 1))

          readiness = Path('docs/release-readiness.md')
          text = readiness.read_text()
          old = '''Detection or a benchmark-ready surface is not promotion. Candidate promotion readiness also requires
          selection evidence, real activation verification, managed lifecycle coverage, reviewed compatibility
          and reversibility, project maturity and combined-stack validation. Broad context owners require an
          additional admission decision before they can own the session context path.
          '''
          new = '''Detection or a benchmark-ready surface is not promotion. Candidate promotion readiness also requires
          selection evidence, real activation verification, managed lifecycle coverage, reviewed compatibility
          and reversibility, project maturity and combined-stack validation. Broad context owners require an
          additional admission decision before they can own the session context path.

          The browser can now compare already-saved candidate/harness campaigns on demand using those same
          gates. That makes the third-mechanism decision easier to review, but it does **not** satisfy the
          third-mechanism requirement by itself: no campaign is created by the comparison and no candidate is
          ranked, activated or promoted automatically.
          '''
          if old not in text:
              raise SystemExit('release-readiness candidate paragraph not found')
          readiness.write_text(text.replace(old, new, 1))
          PY
      - name: Format changed source and docs
        run: >-
          pnpm exec prettier --write
          apps/cli/src/guided-candidate-comparison-client.ts
          apps/cli/src/guided-candidate-readiness-client.ts
          apps/cli/test/guided-candidate-comparison-client.test.ts
          apps/cli/test/guided-candidate-readiness-client.test.ts
          README.md
          docs/optimizer-priorities.md
          docs/release-readiness.md
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/candidate-comparison-docs-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: explain on-demand candidate comparison"
          git push origin HEAD:feat/candidate-campaign-comparison
