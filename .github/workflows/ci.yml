name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Capture deterministic Prettier output
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write scripts/evaluation/gitnexus-real-campaign.mjs
          node -e "const fs=require('node:fs'); process.stdout.write('FORMATTED_BASE64='+fs.readFileSync('scripts/evaluation/gitnexus-real-campaign.mjs').toString('base64')+'\n')"
          exit 1
