name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/gitnexus-autonomous-real-campaign
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write scripts/evaluation/gitnexus-real-campaign.mjs
          git diff --exit-code -- docs/candidates/gitnexus-real-campaign.md docs/development-status.md
          if git diff --quiet -- scripts/evaluation/gitnexus-real-campaign.mjs; then
            echo "Script already formatted"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/evaluation/gitnexus-real-campaign.mjs
          git commit -m "fix(format): apply repository Prettier to GitNexus runner"
          git push origin HEAD:codex/gitnexus-autonomous-real-campaign
