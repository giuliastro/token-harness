name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Keep the UI safety guarantee contiguous
        if: runner.os == 'Linux'
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git fetch origin "$HEAD_BRANCH:$HEAD_BRANCH"
          git checkout "$HEAD_BRANCH"
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/cli/src/ui.ts')
          text = path.read_text()
          old = '''The dashboard listens only on 127.0.0.1 and is read-only. It does not send data\nanywhere and cannot change configuration. It shows what is active, what needs attention,\nand what to do next. When the setup is ready, keep using Claude Code, Codex, or OpenCode\nnormally — Token Harness does not replace their launch commands. Close the local dashboard\nserver with Ctrl+C.`;'''
          new = '''The dashboard listens only on 127.0.0.1 and is read-only.\nIt does not send data anywhere and cannot change configuration.\nIt shows what is active, what needs attention, and what to do next. When the setup is ready,\nkeep using Claude Code, Codex, or OpenCode normally — Token Harness does not replace their\nlaunch commands. Close the local dashboard server with Ctrl+C.`;'''
          if old not in text:
              raise SystemExit('UI safety copy target not found')
          path.write_text(text.replace(old, new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cli/src/ui.ts
          git commit -m "fix(ui): keep local safety guarantee explicit"
          git push origin HEAD:"$HEAD_BRANCH"
          exit 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle smoke test
        run: pnpm smoke

      - name: Stage the publishable package
        run: pnpm package

      - name: Install smoke test
        run: pnpm smoke:install
