name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Windows is first in the matrix, and the matrix does not fail fast, so a
      # Windows failure is visible immediately rather than after two green jobs.
      # PLAN §1.1 and §7: Windows is the primary development platform for the
      # platform and state layers, and its failures are the ones this project
      # exists to catch early.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          # The RFC 0001 runtime floor. CI runs the oldest supported runtime, so
          # a feature newer than the floor fails here rather than for a user.
          node-version: '22.13.0'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Show exact Prettier diff
        if: runner.os == 'Linux'
        run: |
          pnpm exec prettier --write packages/adapters/src/providers/harnesstrim.ts packages/adapters/test/harnesstrim.test.ts
          git diff -- packages/adapters/src/providers/harnesstrim.ts packages/adapters/test/harnesstrim.test.ts
          exit 1

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle smoke test
        run: pnpm smoke

      - name: Stage the publishable package
        run: pnpm package

      # The bundle running is not the same as the package installing: the manifest
      # could name the wrong bin, omit the file, or carry a dependency npm cannot
      # resolve, and the bundle would still run when invoked directly. This packs,
      # installs the tarball with no workspace above it, and runs the result — on all
      # three platforms, because a package that installs on Linux and not on Windows is
      # the failure PLAN §1.1 puts Windows first in the matrix to catch.
      - name: Install smoke test
        run: pnpm smoke:install
