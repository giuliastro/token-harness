name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Windows is first in the matrix, and the matrix does not fail fast, so a
      # Windows failure is visible immediately rather than after two green jobs.
      # PLAN §1.1 and §7: Windows is the primary development platform for the
      # platform and state layers, and its failures are the ones this project
      # exists to catch early.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          # The RFC 0001 runtime floor. CI runs the oldest supported runtime, so
          # a feature newer than the floor fails here rather than for a user.
          node-version: '22.13.0'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package smoke test
        run: pnpm smoke
