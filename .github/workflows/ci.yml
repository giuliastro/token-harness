name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Capture deterministic Prettier output
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write scripts/evaluation/gitnexus-real-campaign.mjs
          node -e "const fs=require('node:fs'); process.stdout.write('FORMATTED_BASE64='+fs.readFileSync('scripts/evaluation/gitnexus-real-campaign.mjs').toString('base64')+'\n')"
          exit 1
      - name: Format check
        if: runner.os != 'Linux'
        run: pnpm format:check
      - name: Test
        run: pnpm test
      - name: GitNexus real-campaign runner self-test
        run: node scripts/evaluation/gitnexus-real-campaign.mjs --self-test
      - name: RTK live Windows release smoke
        if: runner.os == 'Windows'
        env:
          TOKEN_HARNESS_LIVE_RTK_RELEASE: '1'
        run: node --test --test-reporter=spec packages/platform/dist/test/rtk-windows-release.live.test.js
      - name: Build
        run: pnpm build
      - name: Bundle smoke test
        run: pnpm smoke
      - name: Stage the publishable package
        run: pnpm package
      - name: Install smoke test
        run: pnpm smoke:install
