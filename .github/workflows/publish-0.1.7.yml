name: Publish 0.1.7

on:
  push:
    branches: [release/0.1.7]

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 57da8ca4574c18852e96cba4902ecdaa77a514dd
          fetch-depth: 0
      - name: Tag exact release commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "57da8ca4574c18852e96cba4902ecdaa77a514dd"
          node -e "if (require('./apps/cli/package.json').version !== '0.1.7') process.exit(1)"
          if git ls-remote --exit-code --tags origin refs/tags/v0.1.7 >/dev/null 2>&1; then
            echo 'v0.1.7 already exists; leaving it unchanged'
          else
            git tag v0.1.7
            git push origin refs/tags/v0.1.7
          fi
      - name: Dispatch trusted release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run release.yml --ref main -f tag=v0.1.7
