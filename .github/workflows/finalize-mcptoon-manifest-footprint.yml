name: Finalize mcptoon manifest footprint

on:
  push:
    branches:
      - codex/mcptoon-manifest-footprint
    paths:
      - .github/workflows/finalize-mcptoon-manifest-footprint.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/mcptoon-manifest-footprint
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.1
      - run: pnpm install --frozen-lockfile
      - run: python scripts/finalize-mcptoon-manifest-footprint.py
      - run: pnpm exec prettier --write apps/cli/src/commands/candidate-benchmark.ts apps/cli/src/commands/mcptoon-manifest-footprint.ts apps/cli/test/mcptoon-manifest-footprint.test.ts apps/cli/test/mcptoon-manifest-footprint-campaign.test.ts packages/adapters/src/providers/mcptoon-managed.ts docs/candidates/mcptoon.md
      - run: pnpm typecheck
      - run: pnpm test
      - name: Commit final branch state
        run: |
          rm .github/workflows/finalize-mcptoon-manifest-footprint.yml
          rm scripts/finalize-mcptoon-manifest-footprint.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(mcptoon): align managed admission with reviewed build"
          git push origin HEAD:codex/mcptoon-manifest-footprint
