name: UX branch formatter

on:
  push:
    branches:
      - ux/first-run-actionable-overview

permissions:
  contents: write

concurrency:
  group: ux-first-run-formatter
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ux/first-run-actionable-overview
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format touched TypeScript
        run: pnpm exec prettier --write apps/cli/src/guided.ts apps/cli/test/guided-dashboard-product.test.ts apps/cli/test/guided.test.ts
      - name: Commit deterministic formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cli/src/guided.ts apps/cli/test/guided-dashboard-product.test.ts apps/cli/test/guided.test.ts
          git commit -m "style: format first-run UX changes"
          git push origin HEAD:ux/first-run-actionable-overview
