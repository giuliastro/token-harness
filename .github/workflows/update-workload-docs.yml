name: update-workload-docs

on:
  push:
    branches:
      - feature/workload-aware-allowance

permissions:
  contents: write

jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/workload-aware-allowance
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python3 .github/workload-docs.py
      - run: pnpm exec prettier --write README.md PLAN.md docs/rfcs/0020-workload-aware-allowance.md
      - name: Commit docs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md PLAN.md docs/rfcs/0020-workload-aware-allowance.md
          git diff --cached --quiet && exit 1
          git commit -m "docs: document workload-aware allowance milestone"
          git push origin HEAD:feature/workload-aware-allowance
