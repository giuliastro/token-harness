name: Temporary UI format

on:
  push:
    branches:
      - feat/ui-onboarding-clarity-2026-09-05

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore: format UI changes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/ui-onboarding-clarity-2026-09-05
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed UI files
        run: >-
          pnpm exec prettier --write
          apps/cli/src/render/simple.ts
          apps/cli/src/ui.ts
          apps/cli/test/setup.test.ts
          apps/cli/test/ui.test.ts
      - name: Commit formatted files and remove this temporary workflow
        shell: bash
        run: |
          rm .github/workflows/format-ui-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format UI changes"
          git push origin HEAD:feat/ui-onboarding-clarity-2026-09-05
