name: Wire mcptoon readiness PR
on:
  push:
    branches:
      - feat/mcptoon-usage-activation-witness
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/mcptoon-usage-activation-witness
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wire formal activation readiness
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/cli/src/guided-candidate-campaign-status.ts')
          s = p.read_text()
          old = "input.candidateId === 'gitnexus'"
          new = "input.candidateId === 'gitnexus' || input.candidateId === 'mcptoon'"
          if s.count(old) != 1:
              raise SystemExit(f'expected one activation readiness marker, found {s.count(old)}')
          s = s.replace(old, new, 1)
          old_note = "Candidate attribution and the browser acknowledgement do not prove activation; GitNexus can pass that gate only from runtime MCP evidence observed at task boundaries. Decision-ready does not mean promotion-ready."
          new_note = "Candidate attribution and the browser acknowledgement do not prove activation; GitNexus requires runtime MCP boundary evidence and mcptoon requires its reviewed local usage witness. Decision-ready does not mean promotion-ready."
          if old_note not in s:
              raise SystemExit('status note marker missing')
          p.write_text(s.replace(old_note, new_note, 1))
          PY
      - run: pnpm exec prettier --write apps/cli/src/guided-candidate-campaign-status.ts
      - run: rm .github/workflows/wire-mcptoon-readiness-pr.yml
      - name: Commit wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/cli/src/guided-candidate-campaign-status.ts .github/workflows/wire-mcptoon-readiness-pr.yml
          git diff --cached --quiet || git commit -m "feat: pass mcptoon activation into promotion readiness"
          git push origin HEAD:feat/mcptoon-usage-activation-witness
