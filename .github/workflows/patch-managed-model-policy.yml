name: patch-managed-model-policy

on:
  push:
    branches:
      - feature/codex-managed-model-policy

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/codex-managed-model-policy
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/patch-managed-model-policy.py
      - run: pnpm exec prettier --write apps/cli/src/commands/plan.ts packages/core/src/state/actions.ts PLAN.md
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/cli/src/commands/plan.ts packages/core/src/state/actions.ts PLAN.md
          git commit -m "feat: admit reviewed Codex model policy"
          git push origin HEAD:feature/codex-managed-model-policy
