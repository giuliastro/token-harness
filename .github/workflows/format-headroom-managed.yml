name: Format Headroom managed test

on:
  push:
    branches:
      - codex/managed-optimization-tools-v2
    paths:
      - .github/workflows/format-headroom-managed.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/managed-optimization-tools-v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/adapters/test/headroom-managed.test.ts
      - name: Commit formatted file and remove this one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-headroom-managed.yml
          git add packages/adapters/test/headroom-managed.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "style: format Headroom managed tests"
          git push origin HEAD:codex/managed-optimization-tools-v2
