name: Record mcptoon RFC0009 row

on:
  push:
    branches:
      - codex/mcptoon-compatibility-promotion
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    name: mcptoon 0.7.10 × Codex 0.152.1 × Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Install exact recording tools
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @openai/codex@0.152.1
          python3 -m pip install --user pipx
          python3 -m pipx install 'mcptoon==0.7.10'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          codex --version
          mcptoon --version
          mcptoon --help | grep -- '--compact'
          mcptoon --help | grep -- '--json'

      - name: Record exact lifecycle fixture
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"

          ROOT="$GITHUB_WORKSPACE/.rfc0009-mcptoon"
          FIXTURE_HOME="$ROOT/home"
          PROJECT="$ROOT/project"
          OUT="$ROOT/fixture"
          rm -rf "$ROOT"
          mkdir -p "$FIXTURE_HOME" "$PROJECT" "$OUT"

          record() {
            node tests/tools/record-row-fixture.mjs \
              --stage "$1" \
              --harness codex \
              --provider mcptoon \
              --home "$FIXTURE_HOME" \
              --project "$PROJECT" \
              --out "$OUT" \
              --reviewed
          }

          record empty

          cat > "$PROJECT/AGENTS.md" <<'EOF'
          # Existing project instructions

          Keep this user-owned guidance.
          EOF
          record brownfield

          node tests/tools/mcptoon-row-lifecycle.mjs \
            --operation apply \
            --home "$FIXTURE_HOME" \
            --project "$PROJECT" \
            --transaction-id mcptoon-codex-row-apply
          record post-apply

          node --input-type=module - "$PROJECT/AGENTS.md" <<'NODE'
          import fs from 'node:fs';
          const file = process.argv[2];
          const text = fs.readFileSync(file, 'utf8');
          const changed = text.replace(
            'Prefer compact/TOON output so MCP schemas and JSON wrappers do not consume avoidable context.',
            'Prefer compact TOON output so MCP schemas and JSON wrappers do not consume avoidable context.',
          );
          if (changed === text) throw new Error('managed mcptoon marker body was not found for drift');
          fs.writeFileSync(file, changed);
          NODE
          record drift

          node tests/tools/mcptoon-row-lifecycle.mjs \
            --operation rollback \
            --home "$FIXTURE_HOME" \
            --project "$PROJECT" \
            --transaction-id mcptoon-codex-row-apply
          record rollback

          node tests/tools/mcptoon-row-lifecycle.mjs \
            --operation apply \
            --home "$FIXTURE_HOME" \
            --project "$PROJECT" \
            --transaction-id mcptoon-codex-row-uninstall-source

          printf '\nUser note added after managed apply.\n' >> "$PROJECT/AGENTS.md"

          node tests/tools/mcptoon-row-lifecycle.mjs \
            --operation uninstall \
            --home "$FIXTURE_HOME" \
            --project "$PROJECT" \
            --transaction-id mcptoon-codex-row-uninstall \
            --source-transaction-id mcptoon-codex-row-uninstall-source
          record uninstall

          test ! -f "$OUT/invalidating-update.json"
          grep -q 'Keep this user-owned guidance.' "$PROJECT/AGENTS.md"
          grep -q 'User note added after managed apply.' "$PROJECT/AGENTS.md"
          if grep -q 'TOKEN-HARNESS:MCPTOON' "$PROJECT/AGENTS.md"; then
            echo 'uninstall left a Token Harness mcptoon marker behind' >&2
            exit 1
          fi

          CODEX_VERSION="$(codex --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          MCPTOON_VERSION="$(mcptoon --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          cat > "$OUT/README.md" <<EOF
          # mcptoon × Codex × Linux RFC 0009 recording

          Recorded by GitHub Actions on a real \\`ubuntu-latest\\` Linux x64 runner from branch
          \\`codex/mcptoon-compatibility-promotion\\`.

          Exact observed combination:

          - Codex CLI: **$CODEX_VERSION**
          - mcptoon: **$MCPTOON_VERSION**
          - platform: **Linux, non-WSL, x64**
          - verification tier supported by this recording: **config-only**

          The recording uses an isolated home and project. The brownfield project starts with
          user-owned \\`AGENTS.md\\` content. Managed apply adds only the Token Harness mcptoon marker
          block. The drift stage edits the managed block. Rollback restores the exact pre-apply
          brownfield file. A second apply followed by surgical uninstall preserves both the original
          user instructions and a user note added after apply while removing only the owned marker.

          \\`invalidating-update.json\\` is intentionally absent: this recording installed only the exact
          reviewed provider version, so no second real mcptoon version was introduced merely to invent
          an update state. RFC 0009 rows remain exact and are not widened by semver inference.
          EOF

          test "$CODEX_VERSION" = '0.152.1'
          test "$MCPTOON_VERSION" = '0.7.10'

      - name: Upload recording
        uses: actions/upload-artifact@v4
        with:
          name: mcptoon-codex-linux-0.152.1-0.7.10
          path: .rfc0009-mcptoon/fixture
          if-no-files-found: error
          retention-days: 7
