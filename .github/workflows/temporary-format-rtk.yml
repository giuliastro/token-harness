name: Temporary RTK formatter

on:
  push:
    branches:
      - feat/rtk-windows-release-updater

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/rtk-windows-release-updater
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/cli/src/commands/update.ts
      - name: Commit formatting only
        shell: bash
        run: |
          if git diff --quiet -- apps/cli/src/commands/update.ts; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/cli/src/commands/update.ts
          git commit -m 'style: format RTK transaction coordinator'
          git push origin HEAD:feat/rtk-windows-release-updater
