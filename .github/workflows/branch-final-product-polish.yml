name: Final product polish

on:
  push:
    branches: [codex/managed-optimization-tools-v2]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/managed-optimization-tools-v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Update product UI and development handoff
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          status = Path('docs/development-status.md')
          text = status.read_text()
          heading = '# Development status\n\n'
          entry = (
              '- 2026-09-17: PR #306 promotes **mcptoon 0.7.10, GitNexus 1.6.12 and Headroom 0.37.0** into the ordinary optional managed provider registry while RTK + HarnessTrim remain the production baseline. '
              'mcptoon may install only through an already-present pipx and owns only reviewed Claude/Codex guidance; Token Harness never bootstraps Python, pipx or administrator prerequisites. '
              'GitNexus manages only the exact reviewed Claude MCP entry, never installs/indexes the package, and keeps its PolyForm Noncommercial boundary visible. '
              'Headroom manages the official local `headroom mcp serve` registration for the default Claude Code 2.x `~/.claude.json` and Codex `~/.codex/config.toml` paths; its Apache-2.0 package install remains a pinned manual prerequisite through an existing uv + Python 3.13 because uv package absence-restoration is not yet a reviewed transaction path. '
              'All three managed configuration lifecycles use exact-version/config-only admission, ownership-aware removal and drift refusal. No Headroom wrap/proxy/deploy, GitNexus indexing, model call or new RTK/HarnessTrim evidence campaign is part of this PR.\n'
              'Current focus: finish the complete Ubuntu/macOS/Windows PR CI (tests, Windows RTK live smoke, build, bundle/package and installed-package smoke), merge only when every job is green, then verify post-merge `main` CI.\n\n'
          )
          if not text.startswith(heading):
              raise SystemExit('development status heading not found')
          if entry.splitlines()[0] not in text:
              text = heading + entry + text[len(heading):]
          status.write_text(text)

          client = Path('apps/cli/src/guided-product-client.ts')
          text = client.read_text()
          old = """    if (component?.health === 'attention' && component.warnings?.length)
      card.append(messageBox('Needs attention', component.warnings[0].message, 'warn'));
    return card;"""
          new = """    if (component?.warnings?.length) {
      const attention = component.health === 'attention';
      const prerequisite = !component.installed && component.nextAction?.kind === 'install-configure';
      if (attention || prerequisite)
        card.append(
          messageBox(
            attention ? 'Needs attention' : 'Prerequisite needed',
            component.warnings[0].message,
            attention ? 'warn' : '',
          ),
        );
    }
    return card;"""
          if old not in text:
              raise SystemExit('managed tool warning block not found')
          client.write_text(text.replace(old, new, 1))
          PY
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Commit polish and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/branch-final-product-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(ui): finalize optional optimizer lifecycle status"
          git push origin HEAD:codex/managed-optimization-tools-v2
