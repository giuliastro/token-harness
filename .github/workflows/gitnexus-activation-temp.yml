name: Temporary GitNexus activation validation
on:
  push:
    branches:
      - feat/gitnexus-activation-verification
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare patch script
        run: python3 scripts/fix-gitnexus-patch-temp.py
      - name: Apply patch
        run: python3 scripts/gitnexus-activation-patch-temp.py
      - name: Patch dependent fixture
        run: python3 scripts/fix-gitnexus-http-fixture-temp.py
      - name: Format
        run: pnpm exec prettier --write packages/core/src/domain/benchmark-context.ts packages/core/test/benchmark-context.test.ts apps/cli/src/commands/candidate-benchmark.ts apps/cli/src/guided-candidate-campaign-status.ts apps/cli/src/guided-candidate-campaign-client.ts apps/cli/test/candidate-benchmark.test.ts apps/cli/test/guided-candidate-campaign-status.test.ts apps/cli/test/guided-candidate-campaign-client.test.ts apps/cli/test/guided-candidate-campaign-http.test.ts docs/candidates/gitnexus.md README.md
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: Commit validated patch
        run: |
          rm .github/workflows/gitnexus-activation-temp.yml
          rm scripts/gitnexus-activation-patch-temp.py scripts/fix-gitnexus-patch-temp.py scripts/fix-gitnexus-http-fixture-temp.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: verify GitNexus activation from runtime MCP evidence"
          git push
