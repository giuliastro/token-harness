name: Finalize GitNexus lifecycle handoff once

on:
  push:
    branches:
      - codex/gitnexus-lifecycle-handoff
    paths:
      - .github/workflows/finalize-gitnexus-handoff-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/gitnexus-lifecycle-handoff

      - name: Update exact handoff line
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/development-status.md')
          lines = path.read_text().splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith('- 2026-09-15: PR #291 adds ')]
          assert len(matches) == 1, matches
          lines[matches[0]] = '- 2026-09-15: PR #291 merged the narrow GitNexus candidate lifecycle into the normal CLI without promoting GitNexus. `apply --candidate gitnexus --harness claude` is admitted only on the exact recorded Claude Code `2.1.269` × GitNexus `1.6.12` × native-Linux non-WSL row and only registers the already-installed CLI as the owned Claude MCP entry; it never installs GitNexus or runs setup/analyze/indexing. `uninstall --candidate gitnexus --harness claude` is ownership-driven, needs no GitNexus binary, refuses user-owned/drifted entries, and treats a later committed removal as invalidating older activation receipts. The existing mcptoon lifecycle implementation is preserved byte-for-byte behind a candidate dispatcher. Final PR CI run `34924201588` and post-merge `main` CI run `34924357457` were green on Ubuntu, macOS and Windows, including the Windows RTK live smoke.'
          path.write_text('\n'.join(lines) + '\n')
          PY

      - name: Commit handoff
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/development-status.md
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m "docs: finalize GitNexus lifecycle handoff"
          git push origin HEAD:codex/gitnexus-lifecycle-handoff
