name: Record mcptoon Claude compatibility row

on:
  push:
    branches:
      - feat/mcptoon-claude-linux-2.1.269-row
    paths:
      - .github/workflows/record-mcptoon-claude-row.yml
      - tests/tools/mcptoon-claude-row-lifecycle.mjs
      - tests/tools/record-mcptoon-claude-row.sh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mcptoon-claude-linux-2.1.269-row
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install workspace and exact reviewed tools
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
          npm install --global @anthropic-ai/claude-code@2.1.269
          python -m pip install --disable-pip-version-check pipx
          python -m pipx install 'mcptoon==0.7.10'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/mcptoon" --version
          claude --version

      - name: Record real lifecycle fixture
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash tests/tools/record-mcptoon-claude-row.sh

      - name: Commit recorded evidence to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/fixtures/rows/mcptoon-claude-linux-2.1.269-0.7.10
          git commit -m 'test: record mcptoon Claude Linux compatibility fixture'
          git push origin HEAD:feat/mcptoon-claude-linux-2.1.269-row
