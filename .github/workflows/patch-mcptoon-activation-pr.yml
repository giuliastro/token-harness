name: Patch mcptoon activation PR
on:
  push:
    branches:
      - feat/mcptoon-usage-activation-witness
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/mcptoon-usage-activation-witness
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch candidate benchmark integration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/cli/src/commands/candidate-benchmark.ts')
          s = p.read_text()
          s = s.replace(
              "  type TaskBenchmarkCaptureStartReport,\n",
              "  type TaskBenchmarkCaptureFinishReport,\n  type TaskBenchmarkCaptureStartReport,\n",
              1,
          )
          s = s.replace(
              "import { runBenchmarkStart } from './benchmark-capture.js';",
              "import { runBenchmarkFinish, runBenchmarkStart } from './benchmark-capture.js';",
              1,
          )
          marker = "import type { CommandContext } from './context.js';\n"
          addition = """import type { CommandContext } from './context.js';
          import {
            readMcptoonActivationReceipt,
            recordMcptoonActivationFinish,
            recordMcptoonActivationStart,
            type McptoonActivationWitnessState,
          } from './mcptoon-activation-witness.js';
          """
          if marker not in s:
              raise SystemExit('context import marker missing')
          s = s.replace(marker, addition, 1)
          old_boundary = """  boundaries: readonly {
              start: GitNexusMcpRuntimeState | undefined;
              finish: GitNexusMcpRuntimeState | undefined;
            }[],
          ): CandidateActivationEvidence {
            if (candidateId !== 'gitnexus') {
              return {
                candidateId,
                state: 'unreviewed',
                verifiedPairs: 0,
                blockedPairs: 0,
                unknownPairs: boundaries.length,
                reason:
                  'this build has no reviewed task-boundary runtime activation witness for this candidate',
              };
            }
          """
          new_boundary = """  boundaries: readonly {
              start: GitNexusMcpRuntimeState | undefined;
              finish: GitNexusMcpRuntimeState | undefined;
              mcptoon?: McptoonActivationWitnessState;
            }[],
          ): CandidateActivationEvidence {
            if (candidateId === 'mcptoon') {
              let verifiedPairs = 0;
              let blockedPairs = 0;
              let unknownPairs = 0;
              for (const boundary of boundaries) {
                if (boundary.mcptoon === 'verified') verifiedPairs += 1;
                else if (boundary.mcptoon === 'blocked') blockedPairs += 1;
                else unknownPairs += 1;
              }
              if (blockedPairs > 0) {
                return {
                  candidateId,
                  state: 'blocked',
                  verifiedPairs,
                  blockedPairs,
                  unknownPairs,
                  reason: `${String(blockedPairs)} optimized pair(s) did not record successful mcptoon activity inside the task window`,
                };
              }
              if (verifiedPairs > 0 && unknownPairs === 0) {
                return {
                  candidateId,
                  state: 'verified',
                  verifiedPairs,
                  blockedPairs,
                  unknownPairs,
                  reason: `${String(verifiedPairs)} optimized pair(s) recorded successful mcptoon 0.7.10 tool activity inside the task window`,
                };
              }
              return {
                candidateId,
                state: 'unreviewed',
                verifiedPairs,
                blockedPairs,
                unknownPairs,
                reason:
                  boundaries.length === 0
                    ? 'no completed optimized task has mcptoon activation evidence yet'
                    : 'one or more optimized tasks lack a complete mcptoon 0.7.10 usage witness',
              };
            }

            if (candidateId !== 'gitnexus') {
              return {
                candidateId,
                state: 'unreviewed',
                verifiedPairs: 0,
                blockedPairs: 0,
                unknownPairs: boundaries.length,
                reason:
                  'this build has no reviewed task-boundary runtime activation witness for this candidate',
              };
            }
          """
          if old_boundary not in s:
              raise SystemExit('activation boundary block missing')
          s = s.replace(old_boundary, new_boundary, 1)

          old_activation = """  const activationBoundaries: Array<{
              start: GitNexusMcpRuntimeState | undefined;
              finish: GitNexusMcpRuntimeState | undefined;
            }> = [];
            for (const slot of slots) {
              if (slot.state !== 'complete') continue;
              const optimizedReceipt = await readReceiptArtifact(context, slot.benchmarkId, 'optimized');
              activationBoundaries.push(
                optimizedReceipt === 'absent' || optimizedReceipt === 'invalid'
                  ? { start: undefined, finish: undefined }
                  : {
                      start: optimizedReceipt.contextAtStart?.gitNexusMcpRuntimeState,
                      finish: optimizedReceipt.contextAtFinish?.gitNexusMcpRuntimeState,
                    },
              );
            }
          """
          new_activation = """  const activationBoundaries: Array<{
              start: GitNexusMcpRuntimeState | undefined;
              finish: GitNexusMcpRuntimeState | undefined;
              mcptoon?: McptoonActivationWitnessState;
            }> = [];
            for (const slot of slots) {
              if (slot.state !== 'complete') continue;
              const optimizedReceipt = await readReceiptArtifact(context, slot.benchmarkId, 'optimized');
              const mcptoonActivation =
                definition.candidateId === 'mcptoon'
                  ? await readMcptoonActivationReceipt(context, slot.benchmarkId)
                  : null;
              activationBoundaries.push(
                optimizedReceipt === 'absent' || optimizedReceipt === 'invalid'
                  ? { start: undefined, finish: undefined, mcptoon: mcptoonActivation?.state }
                  : {
                      start: optimizedReceipt.contextAtStart?.gitNexusMcpRuntimeState,
                      finish: optimizedReceipt.contextAtFinish?.gitNexusMcpRuntimeState,
                      mcptoon: mcptoonActivation?.state,
                    },
              );
            }
          """
          if old_activation not in s:
              raise SystemExit('campaign activation block missing')
          s = s.replace(old_activation, new_activation, 1)

          start_a = s.index('/**\n * Start the normal benchmark capture')
          start_b = s.index('/** Add candidate-specific summaries', start_a)
          new_start = r'''/**
           * Start the normal benchmark capture, persist candidate identity beside it, and capture a
           * privacy-bounded mcptoon usage boundary for optimized mcptoon runs. Candidate identity by
           * itself is still not activation proof.
           */
          export async function runCandidateBenchmarkStart(
            context: CommandContext,
          ): Promise<CommandResult<CandidateAwareTaskBenchmarkCaptureStartReport | null>> {
            const requestedCandidate = context.optimizationCandidate ?? null;
            const benchmarkId = context.benchmarkId ?? null;
            const projectId = context.adapters?.projectIdFor(context.projectRoot) ?? null;
            const existing =
              benchmarkId === null ? 'absent' : await readCandidateBenchmarkAttribution(context, benchmarkId);

            if (requestedCandidate !== null && benchmarkId !== null) {
              if (
                existing === 'invalid' ||
                (existing !== 'absent' &&
                  (existing.candidateId !== requestedCandidate ||
                    (projectId !== null && existing.projectId !== projectId)))
              ) {
                return {
                  command: 'benchmark-start',
                  exitCode: EXIT_CODES['precondition-drift'],
                  data: null,
                  diagnostics: [
                    diagnostic({
                      severity: 'error',
                      code: 'candidate-benchmark-attribution-conflict',
                      message: `Benchmark ${benchmarkId} already has incompatible candidate attribution`,
                      remediation: 'Use a new benchmark id instead of reusing ambiguous experiment state',
                    }),
                  ],
                };
              }
            }

            const result = await runBenchmarkStart(context);
            if (result.data === null || result.exitCode !== EXIT_CODES.ok) return result;

            let candidateId: OptimizationCandidateId | null = null;
            if (
              existing !== 'absent' &&
              existing !== 'invalid' &&
              existing.benchmarkId === result.data.capture.benchmarkId &&
              existing.projectId === result.data.capture.projectId
            ) {
              candidateId = existing.candidateId;
            } else if (requestedCandidate !== null) {
              const written = await writeCandidateBenchmarkAttribution(context, {
                schemaVersion: 1,
                benchmarkId: result.data.capture.benchmarkId,
                candidateId: requestedCandidate,
                projectId: result.data.capture.projectId,
              });
              if (!written) {
                return {
                  ...result,
                  diagnostics: [
                    ...result.diagnostics,
                    diagnostic({
                      severity: 'warning',
                      code: 'candidate-benchmark-attribution-write-failed',
                      message:
                        'The benchmark capture was created, but its optional candidate attribution could not be saved',
                      remediation:
                        'Keep the capture as ordinary benchmark evidence and use a new id for candidate-specific evidence',
                    }),
                  ],
                };
              }
              candidateId = requestedCandidate;
            }

            if (candidateId === null) return result;

            const decorated: CommandResult<CandidateAwareTaskBenchmarkCaptureStartReport | null> = {
              ...result,
              data: { ...result.data, candidateId },
            };
            if (candidateId !== 'mcptoon' || result.data.capture.variant !== 'optimized') {
              return decorated;
            }

            const witnessWritten = await recordMcptoonActivationStart(context, {
              benchmarkId: result.data.capture.benchmarkId,
              projectId: result.data.capture.projectId,
              startedAt: result.data.capture.startedAt,
            });
            return witnessWritten
              ? decorated
              : {
                  ...decorated,
                  diagnostics: [
                    ...decorated.diagnostics,
                    diagnostic({
                      severity: 'warning',
                      code: 'mcptoon-activation-witness-start-unavailable',
                      message:
                        'The optimized benchmark started, but its passive mcptoon usage boundary could not be saved',
                      remediation:
                        'Keep this pair as selection evidence only; use a new pair for activation evidence',
                    }),
                  ],
                };
          }

          /** Finish the ordinary receipt, then seal mcptoon activation evidence beside it when applicable. */
          export async function runCandidateBenchmarkFinish(
            context: CommandContext,
          ): Promise<CommandResult<TaskBenchmarkCaptureFinishReport | null>> {
            const result = await runBenchmarkFinish(context);
            if (result.data === null || result.exitCode !== EXIT_CODES.ok) return result;
            if (result.data.receipt.variant !== 'optimized') return result;

            const attribution = await readCandidateBenchmarkAttribution(
              context,
              result.data.receipt.benchmarkId,
            );
            if (
              attribution === 'absent' ||
              attribution === 'invalid' ||
              attribution.candidateId !== 'mcptoon'
            ) {
              return result;
            }

            const witness = await recordMcptoonActivationFinish(context, {
              benchmarkId: result.data.receipt.benchmarkId,
              projectId: attribution.projectId,
              completedAt: result.data.receipt.completedAt,
            });
            return witness !== null
              ? result
              : {
                  ...result,
                  diagnostics: [
                    ...result.diagnostics,
                    diagnostic({
                      severity: 'warning',
                      code: 'mcptoon-activation-witness-finish-unavailable',
                      message:
                        'The benchmark receipt is valid, but its mcptoon activation witness could not be finalized',
                      remediation:
                        'Keep this pair as selection evidence only; use a new pair for activation evidence',
                    }),
                  ],
                };
          }

          '''
          s = s[:start_a] + new_start + s[start_b:]
          p.write_text(s)

          p = Path('apps/cli/src/run.ts')
          s = p.read_text()
          old = """import {
            runCandidateBenchmarkMatrix,
            runCandidateBenchmarkStart,
          } from './commands/candidate-benchmark.js';
          """
          new = """import {
            runCandidateBenchmarkFinish,
            runCandidateBenchmarkMatrix,
            runCandidateBenchmarkStart,
          } from './commands/candidate-benchmark.js';
          """
          if old not in s:
              raise SystemExit('run import block missing')
          s = s.replace(old, new, 1)
          s = s.replace("  'benchmark-finish': runBenchmarkFinish,", "  'benchmark-finish': runCandidateBenchmarkFinish,", 1)
          p.write_text(s)
          PY
      - run: pnpm exec prettier --write apps/cli/src/commands/mcptoon-activation-witness.ts apps/cli/src/commands/candidate-benchmark.ts apps/cli/src/run.ts apps/cli/test/mcptoon-activation-witness.test.ts
      - run: rm .github/workflows/patch-mcptoon-activation-pr.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/cli/src/commands/mcptoon-activation-witness.ts apps/cli/src/commands/candidate-benchmark.ts apps/cli/src/run.ts apps/cli/test/mcptoon-activation-witness.test.ts .github/workflows/patch-mcptoon-activation-pr.yml
          git diff --cached --quiet || git commit -m "feat: wire mcptoon usage activation evidence"
          git push origin HEAD:feat/mcptoon-usage-activation-witness
