name: tmp-guidance-state-ui

on:
  push:
    branches:
      - feature/guidance-state-ui

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/guidance-state-ui
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node .tmp-fix2-guidance-state-ui.mjs
      - run: node .tmp-fix3-guidance-state-ui.mjs
      - run: node .tmp-guidance-state-ui.mjs
      - run: node .tmp-fix4-guidance-state-ui.mjs
      - name: Remove temporary finalizer inputs
        run: rm .tmp-guidance-state-ui.mjs .tmp-fix-guidance-state-ui.mjs .tmp-fix2-guidance-state-ui.mjs .tmp-fix3-guidance-state-ui.mjs .tmp-fix4-guidance-state-ui.mjs .github/workflows/tmp-guidance-state-ui.yml
      - run: >-
          pnpm exec prettier --write
          apps/cli/src/agent-skill.ts
          apps/cli/src/guided.ts
          apps/cli/src/guided-client.ts
          apps/cli/src/main.ts
          apps/cli/test/agent-skill-install.test.ts
          apps/cli/test/guidance-state-ui.test.ts
          README.md
          PLAN.md
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm package
      - run: pnpm smoke:install
      - name: Commit finalized product diff
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: show live in-session guidance state"
          git push origin HEAD:feature/guidance-state-ui
