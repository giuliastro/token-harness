name: RTK Windows live smoke

on:
  push:
    branches:
      - feat/rtk-windows-release-updater

permissions:
  contents: read

jobs:
  live-rtk-release-update:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install and build Token Harness
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Seed real RTK 0.48.0 executable
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'rtk-live-smoke'
          $zip = Join-Path $root 'rtk-0.48.0.zip'
          $bin = Join-Path $root 'bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/rtk-ai/rtk/releases/download/v0.48.0/rtk-x86_64-pc-windows-msvc.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $bin -Force
          if (-not (Test-Path (Join-Path $bin 'rtk.exe'))) {
            throw 'The official RTK 0.48.0 archive did not contain rtk.exe at its root.'
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify seeded RTK version
        shell: pwsh
        run: |
          $version = (& rtk --version 2>&1 | Out-String).Trim()
          Write-Host "Seeded: $version"
          if ($version -notmatch '0\.48\.0') { throw "Expected RTK 0.48.0, got: $version" }

      - name: Exercise Token Harness direct release updater
        shell: pwsh
        env:
          TOKEN_HARNESS_HOME: ${{ runner.temp }}\token-harness-state
        run: |
          node dist/bundle/token-harness.mjs update --provider rtk --yes --json | Tee-Object -FilePath "$env:RUNNER_TEMP\rtk-update.json"
          if ($LASTEXITCODE -ne 0) { throw "token-harness update exited $LASTEXITCODE" }

      - name: Verify real RTK 0.49.0 replacement
        shell: pwsh
        run: |
          $version = (& rtk --version 2>&1 | Out-String).Trim()
          Write-Host "Updated: $version"
          if ($version -notmatch '0\.49\.0') { throw "Expected RTK 0.49.0, got: $version" }
