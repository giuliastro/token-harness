name: release bridge

on:
  push:
    branches:
      - 'release/v*'

permissions:
  contents: write
  actions: write

concurrency:
  group: release-bridge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: create or recover tag and dispatch release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate release branch
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          cli_version="$(node -p "require('./apps/cli/package.json').version")"
          if [ "$version" != "$cli_version" ]; then
            echo "root version $version does not match CLI version $cli_version" >&2
            exit 1
          fi
          expected="release/v$version"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "release branch $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi

          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; dispatching the trusted workflow in recovery mode"
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        if: steps.release.outputs.tag_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v$VERSION" \
            -f sha="$GITHUB_SHA"

      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG_EXISTS: ${{ steps.release.outputs.tag_exists }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          if [ "$TAG_EXISTS" = "true" ]; then
            # The immutable tag may predate the current trusted-publishing workflow. Run the
            # workflow definition from the default branch, but make it rebuild and validate the
            # exact existing tag through its `tag` recovery input.
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" \
              --input - <<JSON
          {"ref":"$DEFAULT_BRANCH","inputs":{"tag":"v$VERSION"}}
          JSON
          else
            # A new release tag carries the same reviewed workflow as its release branch, so run
            # the release definition from that exact immutable tag.
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" \
              -f ref="v$VERSION"
          fi
