name: model-milestone-patch

on:
  push:
    branches: [feature/model-quality-per-allowance]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/model-quality-per-allowance
      - name: Patch optimizer, planner and executor
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          optimize = 'apps/cli/src/commands/optimize.ts'
          replace_once(
              optimize,
              "  refineEffortForAllowance,\n  refineEffortWithOutcomes,\n  refineVerbosityForAllowance,",
              "  refineEffortForAllowance,\n  refineEffortWithOutcomes,\n  refineModelForAllowance,\n  refineModelWithOutcomes,\n  refineVerbosityForAllowance,",
          )

          marker = """  const verbosityPerAllowance =
            verbosityLearning === null
              ? null
              : refineVerbosityForAllowance({
                  taskClass,
                  learning: verbosityLearning,
                  baseCapacity: exactVerbosityCapacity(verbosityLearning.baseVerbosity),
                  candidateCapacity: exactVerbosityCapacity(verbosityLearning.candidateVerbosity),
                });

          if (effortLearning.state === 'learned' || effortLearning.state === 'deferred') {"""
          replacement = """  const verbosityPerAllowance =
            verbosityLearning === null
              ? null
              : refineVerbosityForAllowance({
                  taskClass,
                  learning: verbosityLearning,
                  baseCapacity: exactVerbosityCapacity(verbosityLearning.baseVerbosity),
                  candidateCapacity: exactVerbosityCapacity(verbosityLearning.candidateVerbosity),
                });

          const preModelRecommendedVerbosity =
            effortLearning.state === 'deferred' || qualityPerAllowance.state === 'deferred'
              ? null
              : recommendedEffort !== currentEffort
                ? context.verbosity
                : verbosityLearning === null
                  ? context.verbosity
                  : verbosityLearning.state === 'deferred'
                    ? null
                    : verbosityPerAllowance === null
                      ? verbosityLearning.baseVerbosity
                      : verbosityPerAllowance.state === 'unavailable'
                        ? verbosityLearning.baseVerbosity
                        : verbosityPerAllowance.recommendedVerbosity;

          const catalogModelNames = [
            ...new Set(context.availableModels.flatMap((model) => [model.id, model.model])),
          ];
          const canLearnModel =
            capturedPolicy !== null &&
            capturedPolicy.model !== null &&
            capturedPolicy.reasoningEffort !== null &&
            capturedPolicy.reasoningEffort === currentEffort &&
            capturedPolicy.verbosity !== null &&
            capturedPolicy.verbosity === context.verbosity &&
            catalogModel !== null &&
            !context.modelCatalogTruncated &&
            recommendedEffort === currentEffort &&
            preModelRecommendedVerbosity === context.verbosity &&
            qualityPerAllowance.state !== 'deferred' &&
            verbosityPerAllowance?.state !== 'deferred';
          const modelLearning = canLearnModel
            ? refineModelWithOutcomes({
                harnessId: context.harnessId,
                baseModel: capturedPolicy.model,
                reasoningEffort: capturedPolicy.reasoningEffort,
                verbosity: capturedPolicy.verbosity,
                taskClass,
                availableModels: catalogModelNames,
                now: input.observedAt,
                receipts: input.benchmarkReceipts,
              })
            : null;
          const exactModelCapacity = (model: string | null) =>
            model === null ||
            capturedPolicy === null ||
            capturedPolicy.reasoningEffort === null ||
            capturedPolicy.verbosity === null ||
            input.benchmarkReceipts === null
              ? null
              : estimateAcceptedTaskCapacityForPolicy({
                  report: budgetReport,
                  receipts: input.benchmarkReceipts,
                  harnessId: context.harnessId,
                  taskClass,
                  reservePercent,
                  policy: {
                    model,
                    reasoningEffort: capturedPolicy.reasoningEffort,
                    verbosity: capturedPolicy.verbosity,
                  },
                });
          const modelPerAllowance =
            modelLearning === null
              ? null
              : refineModelForAllowance({
                  taskClass,
                  learning: modelLearning,
                  baseCapacity: exactModelCapacity(modelLearning.baseModel),
                  candidateCapacity: exactModelCapacity(modelLearning.candidateModel),
                });

          if (effortLearning.state === 'learned' || effortLearning.state === 'deferred') {"""
          replace_once(optimize, marker, replacement)

          old_model = """  const recommendedModel = catalogModel === null ? null : context.model;
          if (catalogModel !== null) {
            recommendations.push({
              area: 'model',
              priority: 'optional',
              action: 'Keep the current discovered model until model-tier quota benchmarks exist',
              target: recommendedModel,
              evidence: [
                {
                  code: 'model-catalog',
                  summary:
                    catalogModel.displayName +
                    ' is present in the installed Codex catalog; no cost ranking is inferred from its name',
                },
              ],
            });
          }
"""
          new_model = """  const recommendedModel =
            catalogModel === null
              ? null
              : modelLearning === null
                ? context.model
                : modelLearning.state === 'deferred'
                  ? null
                  : modelPerAllowance === null || modelPerAllowance.state === 'unavailable'
                    ? context.model
                    : modelPerAllowance.recommendedModel;
          if (catalogModel !== null) {
            const modelEvidence: RecommendationEvidence[] = [
              {
                code: 'model-catalog',
                summary:
                  catalogModel.displayName +
                  ' is present in the installed native catalog; no cost or quality tier is inferred from its name',
              },
              ...(modelLearning?.reasons ?? []),
              ...(modelPerAllowance?.reasons ?? []),
            ];
            recommendations.push({
              area: 'model',
              priority:
                modelPerAllowance?.state === 'quality-recovery'
                  ? 'first'
                  : modelPerAllowance?.state === 'allowance-efficient'
                    ? 'next'
                    : 'optional',
              action:
                modelLearning?.state === 'deferred' || modelPerAllowance?.state === 'deferred'
                  ? 'Checkpoint or recheck allowance before another model change; no proven catalog alternative currently fits the safe capacity'
                  : recommendedModel === context.model
                    ? modelPerAllowance?.state === 'kept'
                      ? 'Keep the current model because the outcome-safe alternative does not improve backend allowance throughput'
                      : modelPerAllowance?.state === 'capacity-unproven'
                        ? 'Keep the current model until both models have complete exact-policy five-hour and weekly allowance evidence'
                        : 'Keep the current discovered model until repeated paired outcome and allowance evidence proves an alternative'
                    : modelPerAllowance?.state === 'allowance-efficient'
                      ? 'Use the quality-gated catalog model that improves accepted-task throughput per included allowance'
                      : 'Use the catalog model supported by repeated quality/retry recovery evidence',
              target: recommendedModel,
              evidence: modelEvidence,
            });
          }
"""
          replace_once(optimize, old_model, new_model)

          old_verbosity = """  const recommendedVerbosity =
            effortLearning.state === 'deferred' || qualityPerAllowance.state === 'deferred'
              ? null
              : recommendedEffort !== currentEffort
                ? context.verbosity
                : verbosityLearning === null
                  ? context.verbosity
                  : verbosityLearning.state === 'deferred'
                    ? null
                    : verbosityPerAllowance === null
                      ? verbosityLearning.baseVerbosity
                      : verbosityPerAllowance.state === 'unavailable'
                        ? verbosityLearning.baseVerbosity
                        : verbosityPerAllowance.recommendedVerbosity;
"""
          replace_once(
              optimize,
              old_verbosity,
              "  const recommendedVerbosity = preModelRecommendedVerbosity;\n",
          )
          replace_once(
              optimize,
              "    ...(verbosityLearning === null ? {} : { verbosityLearning }),\n    currentVerbosity:",
              "    ...(verbosityLearning === null ? {} : { verbosityLearning }),\n    ...(modelLearning === null ? {} : { modelLearning }),\n    currentVerbosity:",
          )

          plan = 'apps/cli/src/commands/plan.ts'
          replace_once(
              plan,
              "  const effortLearning = advice.effortLearning;\n  const verbosityLearning = advice.verbosityLearning;\n  if (effortLearning?.state === 'deferred' || verbosityLearning?.state === 'deferred') {",
              "  const effortLearning = advice.effortLearning;\n  const verbosityLearning = advice.verbosityLearning;\n  const modelLearning = advice.modelLearning;\n  if (\n    effortLearning?.state === 'deferred' ||\n    verbosityLearning?.state === 'deferred' ||\n    modelLearning?.state === 'deferred'\n  ) {",
          )
          replace_once(
              plan,
              "  if (effortLearning?.state !== 'learned' && verbosityLearning?.state !== 'learned') return true;",
              "  if (\n    effortLearning?.state !== 'learned' &&\n    verbosityLearning?.state !== 'learned' &&\n    modelLearning?.state !== 'learned'\n  )\n    return true;",
          )
          insert_before_return = """  if (modelLearning?.state === 'learned') {
            const catalogComplete = !observation.modelCatalogTruncated;
            const currentKnown = observation.availableModels.some(
              (model) => model.model === advice.currentModel || model.id === advice.currentModel,
            );
            const recommendedKnown =
              advice.recommendedModel !== null &&
              observation.availableModels.some(
                (model) =>
                  model.model === advice.recommendedModel || model.id === advice.recommendedModel,
              );
            if (
              observed.model !== advice.currentModel ||
              observed.reasoningEffort !== modelLearning.policy.reasoningEffort ||
              observed.verbosity !== modelLearning.policy.verbosity ||
              advice.recommendedEffort !== advice.currentEffort ||
              advice.recommendedVerbosity !== advice.currentVerbosity ||
              advice.recommendedModel === null ||
              !catalogComplete ||
              !currentKnown ||
              !recommendedKnown ||
              (advice.recommendedModel !== advice.currentModel &&
                advice.recommendedModel !== modelLearning.candidateModel)
            ) {
              diagnostics.push(
                diagnostic({
                  severity: 'warning',
                  code: 'model-native-policy-drift',
                  subject: advice.harnessId,
                  message:
                    'Model catalog or fixed effort/verbosity changed after the single-control model recommendation',
                  remediation:
                    'Re-run token-harness optimize and plan against one complete native model catalog and stable policy tuple',
                }),
              );
              return false;
            }
          }

          return true;"""
          replace_once(plan, "  return true;\n}\n\nasync function appendCodexNativePolicy", insert_before_return + "\n}\n\nasync function appendCodexNativePolicy")
          replace_once(
              plan,
              "    keyPath: 'model_reasoning_effort' | 'model_verbosity';",
              "    keyPath: 'model' | 'model_reasoning_effort' | 'model_verbosity';",
          )
          replace_once(
              plan,
              "  consider({\n    keyPath: 'model_reasoning_effort',",
              "  consider({\n    keyPath: 'model',\n    adviceCurrent: advice.currentModel,\n    observedCurrent: observation.model,\n    recommended: advice.recommendedModel,\n  });\n  consider({\n    keyPath: 'model_reasoning_effort',",
          )
          replace_once(
              plan,
              "    modelReference: null,",
              "    modelReference:\n      advice.recommendedModel !== null && edits.some((edit) => edit.keyPath === 'model')\n        ? { requested: advice.recommendedModel, resolution: 'native-catalog' }\n        : null,",
          )

          actions = 'packages/core/src/state/actions.ts'
          replace_once(
              actions,
              "const SUBSCRIPTION_SAFE_CODEX_KEYS = new Set(['model_reasoning_effort', 'model_verbosity']);",
              "const SUBSCRIPTION_SAFE_CODEX_KEYS = new Set([\n  'model',\n  'model_reasoning_effort',\n  'model_verbosity',\n]);",
          )
          replace_once(
              actions,
              "'Recompute the plan with the current Token Harness build; provider, auth, model, and service-tier changes require a separately reviewed policy path',",
              "'Recompute the plan with the current Token Harness build; provider, auth and service-tier changes require a separately reviewed policy path',",
          )
          PY
          rm .github/workflows/model-milestone-patch.yml
          pnpm exec prettier --write apps/cli/src/commands/optimize.ts apps/cli/src/commands/plan.ts packages/core/src/state/actions.ts packages/core/src/domain/model-learning.ts packages/core/src/domain/model-quality-per-allowance.ts packages/core/test/model-learning.test.ts packages/core/test/model-quality-per-allowance.test.ts packages/core/src/index.ts packages/core/src/domain/optimizer.ts
          git config user.name giuliastro
          git config user.email giuliaccio@gmail.com
          git add -A
          git commit -m "feat: integrate model quality per allowance"
          git push origin HEAD:feature/model-quality-per-allowance
