name: Outcome validation workspace
on:
  push:
    branches: [feature/outcome-aware-effort-optimizer]
    paths: [.github/workflows/outcome-validation-workspace.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Export tracked sources only
        run: git archive --format=tar.gz -o /tmp/outcome-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: outcome-source
          path: /tmp/outcome-source.tar.gz
          retention-days: 1
