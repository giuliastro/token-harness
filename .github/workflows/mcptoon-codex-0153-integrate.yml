name: Integrate mcptoon Codex 0.153.0 row

on:
  push:
    branches:
      - codex/mcptoon-codex-0.153.0-row
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/mcptoon-codex-0.153.0-row

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Apply exact-row integration patch
        run: python3 tests/tools/integrate-mcptoon-codex-0153.py

      - name: Format changed sources
        run: pnpm exec prettier --write packages/core/src/domain/compatibility-rows.ts packages/core/test/compatibility-rows.test.ts apps/cli/test/mcptoon-campaign-version-admission.test.ts docs/candidates/mcptoon-selection-surface.md docs/development-status.md

      - name: Validate integration
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build

      - name: Commit integration and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          rm tests/tools/integrate-mcptoon-codex-0153.py
          rm .github/workflows/mcptoon-codex-0153-integrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(mcptoon): admit exact Codex 0.153.0 Linux row'
          git push origin HEAD:codex/mcptoon-codex-0.153.0-row
