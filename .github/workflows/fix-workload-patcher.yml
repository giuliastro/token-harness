name: fix-workload-patcher

on:
  push:
    branches:
      - feature/workload-aware-allowance

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/workload-aware-allowance
      - name: Make apply help anchor specific
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/workload-controller-patch.yml')
          lines = p.read_text().splitlines()
          needle = '              "                      [--task <class>] [--profile <name>] [--reserve <0-95>]",'
          matches = [i for i, line in enumerate(lines) if line == needle and i > 0 and "rep('apps/cli/src/usage.ts'" in lines[i - 1]]
          if len(matches) != 1:
              raise SystemExit(f'expected one ambiguous usage call, got {len(matches)}')
          i = matches[0]
          lines[i - 1:i + 2] = [
              "          rep('apps/cli/src/usage.ts',",
              '              "  token-harness apply [--json] [--yes] [--plan <id>] [--harness <id>]\\\\n                      [--provider <id>] [--project <dir>] [--native-policy]\\\\n                      [--task <class>] [--profile <name>] [--reserve <0-95>]",',
              '              "  token-harness apply [--json] [--yes] [--plan <id>] [--harness <id>]\\\\n                      [--provider <id>] [--project <dir>] [--native-policy]\\\\n                      [--task <class>] [--profile <name>] [--reserve <0-95>]\\\\n                      [--tasks-left <n>]")',
          ]
          p.write_text('\n'.join(lines) + '\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/workload-controller-patch.yml
          git commit -m "chore: fix workload patch help anchor"
          git push origin HEAD:feature/workload-aware-allowance
