name: Validate pipx absence rollback

on:
  push:
    branches:
      - codex/candidate-managed-lifecycle

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/candidate-managed-lifecycle
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/dev/patch-pipx-absence-rollback.py
      - name: Format patched sources
        run: pnpm exec prettier --write packages/core/src/state/install.ts packages/core/test/package-inventory.test.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Live pipx install and absence rollback smoke
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pipx
          export PIPX_HOME="$RUNNER_TEMP/pipx-home"
          export PIPX_BIN_DIR="$RUNNER_TEMP/pipx-bin"
          mkdir -p "$PIPX_HOME" "$PIPX_BIN_DIR"
          pipx install --force --output json 'mcptoon==0.7.10'
          pipx list --output json > "$RUNNER_TEMP/pipx-before.json"
          python -c "import json,os; d=json.load(open(os.environ['RUNNER_TEMP'] + '/pipx-before.json')); assert d['venvs']['mcptoon']['metadata']['main_package']['package_version'] == '0.7.10'"
          pipx uninstall mcptoon
          pipx list --output json > "$RUNNER_TEMP/pipx-after.json"
          python -c "import json,os; d=json.load(open(os.environ['RUNNER_TEMP'] + '/pipx-after.json')); assert 'mcptoon' not in d['venvs']"
      - name: Commit validated rollback changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/src/state/install.ts packages/core/test/package-inventory.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix: restore pipx absence transactionally"
            git push origin HEAD:codex/candidate-managed-lifecycle
          fi
