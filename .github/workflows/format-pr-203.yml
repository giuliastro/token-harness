name: Format PR 203

on:
  push:
    branches: [feat/candidate-benchmark-evidence]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/candidate-benchmark-evidence
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cli/src/argv.ts apps/cli/src/commands/candidate-benchmark.ts apps/cli/src/commands/context.ts apps/cli/src/guided-value.ts apps/cli/src/run.ts apps/cli/test/guided-value.test.ts
          git commit -m "chore: format candidate benchmark slice"
          git push origin HEAD:feat/candidate-benchmark-evidence
