name: temporary format context owner admission

on:
  push:
    branches:
      - feature/context-owner-admission

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/context-owner-admission
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/core/src/domain/context-owner-admission.ts packages/core/test/context-owner-admission.test.ts docs/rfcs/0026-context-owner-admission.md
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/core/src/domain/context-owner-admission.ts packages/core/test/context-owner-admission.test.ts docs/rfcs/0026-context-owner-admission.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format context owner admission"
          git push origin HEAD:feature/context-owner-admission
