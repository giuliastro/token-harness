name: Format mcptoon Claude row helper fast

on:
  push:
    branches:
      - feat/mcptoon-claude-linux-2.1.269-row
    paths:
      - .github/workflows/format-mcptoon-claude-row-fast.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/mcptoon-claude-linux-2.1.269-row
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write tests/tools/mcptoon-claude-row-lifecycle.mjs
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/tools/mcptoon-claude-row-lifecycle.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'style: format mcptoon Claude row lifecycle helper'
          git push origin HEAD:feat/mcptoon-claude-linux-2.1.269-row
