name: Finalize managed optimization tools

on:
  push:
    branches:
      - codex/managed-optimization-tools-v2

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/managed-optimization-tools-v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Apply final product fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'{path}: replacement target not found: {old[:100]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'apps/cli/src/guided.ts',
              "!['rtk', 'harnesstrim', 'mcptoon', 'gitnexus'].includes(String(data['provider']))",
              "!['rtk', 'harnesstrim', 'mcptoon', 'gitnexus', 'headroom'].includes(String(data['provider']))",
          )

          replace_once(
              'packages/adapters/src/providers/headroom-managed.ts',
              '      bodyDigest: digestText(HEADROOM_CODEX_MCP_BODY),',
              '      bodyDigest: digestText(`${HEADROOM_CODEX_MCP_BODY}\\n`),',
          )

          replace_once(
              'packages/adapters/src/providers/headroom-provider.ts',
              '    remediation: `With your existing uv and Python 3.13 installation, run: uv tool install --python 3.13 --no-python-downloads "headroom-ai[mcp]==${HEADROOM_REVIEWED_MCP_VERSION}". Token Harness does not install uv, Python, or admin prerequisites.`,',
              '    remediation: `With an existing uv and system Python >=3.10, run: uv tool install --no-managed-python --no-python-downloads "headroom-ai[mcp]==${HEADROOM_REVIEWED_MCP_VERSION}". Token Harness does not install uv, Python, or admin prerequisites.`,',
          )

          guided_test_marker = "  it('rejects expired tickets, replacement previews, arbitrary commands and extra fields', async () => {"
          guided_test = """  it('accepts Headroom as an optional provider-scoped managed setup', async () => {
            const { service, calls } = fixture({ ids: ['codex'] });
            const preview = await service.preview({
              action: 'setup',
              harness: 'codex',
              provider: 'headroom',
            });
            assert.notEqual(preview.ticket, null);
            assert.deepEqual(
              calls.find((args) => args[0] === 'plan'),
              ['plan', '--harness', 'codex', '--provider', 'headroom'],
            );
          });

          """
          replace_once('apps/cli/test/guided.test.ts', guided_test_marker, guided_test + guided_test_marker)

          replace_once(
              'README.md',
              'Token Harness also exposes **mcptoon** and **GitNexus** as optional managed integrations on their exact\nreviewed lifecycle rows;',
              'Token Harness also exposes **mcptoon**, **GitNexus** and **Headroom** as optional managed integrations on their exact\nreviewed lifecycle rows;',
          )
          replace_once(
              'README.md',
              """**3. Experimental tools**

          Headroom remains visible as an unmanaged experimental candidate. mcptoon and GitNexus retain their
          selection/promotion evidence paths, but their narrow reviewed lifecycle is now also available through
          normal optional managed setup. Lifecycle support is not production promotion. Token Harness still does
          not install system prerequisites, activate Headroom wrappers, or create/refresh GitNexus repository
          indexes.
          """,
              """**3. Evaluation evidence (maintainers)**

          mcptoon, GitNexus and Headroom retain their evaluation and promotion-evidence paths, but those are no
          longer a separate setup concept in the novice product. Their narrow reviewed lifecycle is available
          through the same Optimization Stack as the production baseline. Lifecycle support is not production
          promotion: Token Harness still does not install system prerequisites, start Headroom wrap/proxy modes,
          or create/refresh GitNexus repository indexes.
          """,
          )
          replace_once(
              'README.md',
              '| GitNexus | Repository graph / MCP context | Optional managed Claude integration for already-installed 1.6.12; license review required |',
              '| GitNexus | Repository graph / MCP context | Optional managed Claude integration for already-installed 1.6.12; license review required |\n| Headroom | Local MCP compression / retrieval | Optional managed Claude/Codex MCP registration for already-installed 0.37.0; no wrap/proxy process started |',
          )

          replace_once(
              'docs/development-status.md',
              'existing uv + Python 3.13',
              'existing uv + a compatible system Python (>=3.10)',
          )
          replace_once(
              'docs/development-status.md',
              '- RTK + HarnessTrim remain the production baseline. mcptoon and GitNexus expose optional reviewed managed lifecycle without becoming production-stack components; Headroom remains candidate-only.',
              '- RTK + HarnessTrim remain the production baseline. mcptoon, GitNexus and Headroom expose optional reviewed managed lifecycle without becoming production-stack components or inheriting a savings claim.',
          )
          PY
      - name: Format
        run: pnpm format
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Commit finalized branch and remove bootstrap
        shell: bash
        run: |
          rm .github/workflows/branch-finalize-managed-tools.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: finish managed optimizer lifecycle"
          git push origin HEAD:codex/managed-optimization-tools-v2
