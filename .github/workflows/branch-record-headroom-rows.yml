name: Record Headroom managed rows

on:
  push:
    branches:
      - codex/managed-optimization-tools-v2

permissions:
  contents: write

jobs:
  record-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/managed-optimization-tools-v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Prepare recording support
        run: node scripts/.tmp-headroom-admission.mjs prepare
      - name: Install exact fixture prerequisites
        shell: bash
        run: |
          set -euo pipefail
          npm install --global '@anthropic-ai/claude-code@2.1.269' '@openai/codex@0.153.0'
          python -m pip install --disable-pip-version-check 'headroom-ai[mcp]==0.37.0'
          claude --version
          codex --version
          headroom --version
          headroom wrap --help >/dev/null
          headroom mcp serve --help >/dev/null
      - name: Build recording tools
        run: pnpm build
      - name: Record Claude row lifecycle
        shell: bash
        run: bash tests/tools/record-headroom-row.sh claude
      - name: Record Codex row lifecycle
        shell: bash
        run: bash tests/tools/record-headroom-row.sh codex
      - name: Admit only the recorded exact rows
        run: node scripts/.tmp-headroom-admission.mjs admit
      - name: Format
        run: pnpm format
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test complete recorded rows
        run: pnpm test
      - name: Commit evidence and remove recording bootstrap
        shell: bash
        run: |
          rm scripts/.tmp-headroom-admission.mjs
          rm .github/workflows/branch-record-headroom-rows.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(headroom): admit recorded Linux managed MCP rows"
          git push origin HEAD:codex/managed-optimization-tools-v2
