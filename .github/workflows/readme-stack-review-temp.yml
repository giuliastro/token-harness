name: Temporary combined-stack README update

on:
  push:
    branches:
      - feat/combined-stack-review-evidence

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/combined-stack-review-evidence
      - name: Update README
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          old = (
              "exact plan, apply it only after approval, verify it, and remove only configuration it owns.\n"
          )
          new = old + (
              "\nFor maintainers validating the combined stack, `token-harness stack-review --json` captures the exact configured provider versions and managed harness sets without making a compatibility decision. The shipped combined-review registry stays empty until that captured configuration has been tested together and deliberately reviewed; see `docs/combined-stack-reviews.md`.\n"
          )
          if old not in text:
              raise SystemExit('README managed-stack paragraph not found')
          p.write_text(text.replace(old, new, 1))
          Path('.github/workflows/readme-stack-review-temp.yml').unlink()
          PY
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write README.md docs/combined-stack-reviews.md docs/release-readiness.md
      - name: Commit README update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs .github/workflows/readme-stack-review-temp.yml
          git commit -m "docs: document combined-stack review capture"
          git push origin HEAD:feat/combined-stack-review-evidence
