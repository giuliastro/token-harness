name: Temporary dedupe stack-review fixtures

on:
  push:
    branches:
      - feat/combined-stack-review-evidence

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/combined-stack-review-evidence
      - name: Remove duplicate injected handlers
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/integration/exit-codes.test.ts')
          text = path.read_text()
          duplicate = (
              "        'stack-review': () => Promise.reject(new Error('unused')),\n"
              "        'stack-review': () => Promise.reject(new Error('unused')),\n"
          )
          single = "        'stack-review': () => Promise.reject(new Error('unused')),\n"
          count = text.count(duplicate)
          if count != 3:
              raise SystemExit(f'expected 3 duplicate pairs, found {count}')
          path.write_text(text.replace(duplicate, single))
          Path('.github/workflows/dedupe-stack-review-tests-temp.yml').unlink()
          PY
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write tests/integration/exit-codes.test.ts
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/exit-codes.test.ts .github/workflows/dedupe-stack-review-tests-temp.yml
          git commit -m "test: dedupe stack-review integration handlers"
          git push origin HEAD:feat/combined-stack-review-evidence
