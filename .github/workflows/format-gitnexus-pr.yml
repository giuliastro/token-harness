name: Format GitNexus MCP changes

on:
  push:
    branches:
      - codex/gitnexus-mcp-transaction

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/gitnexus-mcp-transaction
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only the files reported by CI
        run: >-
          pnpm exec prettier --write
          packages/adapters/src/providers/gitnexus-managed.ts
          packages/adapters/test/gitnexus-candidate.test.ts
          packages/adapters/test/gitnexus-managed.test.ts
      - name: Commit formatted files and remove this one-shot workflow
        run: |
          rm .github/workflows/format-gitnexus-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format GitNexus MCP lifecycle"
          git push
