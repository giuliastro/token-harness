name: Temporary Windows evidence handoff update

on:
  push:
    branches:
      - codex/windows-stack-evidence-collector
    paths:
      - '.github/workflows/tmp-update-windows-evidence-handoff.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/windows-stack-evidence-collector
      - name: Update development handoff
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/development-status.md')
          s = p.read_text()
          old_focus = 'Current focus: keep the GitNexus real campaign quota-safe after the successful branch-only OAuth/Haiku smoke; validate the frugal campaign controls fully before any explicitly dispatched eight-pair selection run.'
          new_focus = 'Current focus: keep the full GitNexus campaign manual and quota-safe; meanwhile complete issue #255 with real before/after evidence from the current RTK + HarnessTrim production stack on native Windows.'
          if old_focus not in s:
              raise SystemExit('expected current-focus line not found')
          s = s.replace(old_focus, new_focus, 1)
          anchor = '- Latest GitNexus evaluation-behavior checkpoint:'
          note = '- 2026-09-16: PR #303 adds a read-only native-Windows evidence collector and runbook for issue #255. CI run `35121678687` validated the collector self-test on Windows together with RTK live, tests, build, bundle/package and install smoke; Ubuntu and macOS remained green. This synthetic collector test is **not** the real production-stack evidence: #255 stays open until before/after captures surround genuine qualifying RTK and HarnessTrim operations on a real Windows machine.\n'
          if anchor not in s:
              raise SystemExit('handoff anchor not found')
          s = s.replace(anchor, note + anchor, 1)
          p.write_text(s)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/development-status.md
          git commit -m 'docs: record Windows evidence collector validation'
          git push origin HEAD:codex/windows-stack-evidence-collector
