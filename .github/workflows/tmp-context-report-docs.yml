name: temporary context report docs

on:
  push:
    branches:
      - feature/context-savings-report

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/context-savings-report
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/tmp-context-report-docs.mjs
      - run: pnpm exec prettier --write README.md packages/core/test/benchmark-context-report.test.ts apps/cli/test/context-savings-render.test.ts apps/cli/src/render/benchmark.ts apps/cli/src/render/benchmark-matrix.ts packages/core/src/domain/benchmark-context-report.ts
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md packages/core/test/benchmark-context-report.test.ts apps/cli/test/context-savings-render.test.ts apps/cli/src/render/benchmark.ts apps/cli/src/render/benchmark-matrix.ts packages/core/src/domain/benchmark-context-report.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: surface context savings evidence"
          git push origin HEAD:feature/context-savings-report
