name: Temporary persist managed tools

on:
  push:
    branches:
      - codex/managed-optimization-tools-v2

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/managed-optimization-tools-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reuse reviewed finisher transformation
        shell: bash
        run: |
          git show 5a612338e6d368f846cb12135ee823fa0c7424b9:.github/workflows/_tmp-finish-managed-tools-v2.yml > /tmp/original-finisher.yml
          python3 - <<'PY'
          from pathlib import Path
          source = Path('/tmp/original-finisher.yml').read_text()
          anchor = source.index('      - name: Finish managed-tool product integration')
          start = source.index('        run: |\n', anchor) + len('        run: |\n')
          end = source.index('      - name: Format changed sources', start)
          lines = source[start:end].splitlines()
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/finish-managed-tools.sh').write_text(block)
          PY
          bash /tmp/finish-managed-tools.sh
      - name: Format generated product changes
        run: >-
          pnpm exec prettier --write
          apps/cli/src/commands/plan.ts
          apps/cli/src/guided.ts
          apps/cli/src/guided-assets.ts
          apps/cli/src/guided-product-client.ts
          apps/cli/test/guided.test.ts
          apps/cli/test/guided-component-uninstall.test.ts
          apps/cli/test/provider-version-admission.test.ts
          packages/adapters/test/registries.test.ts
          tests/integration/distribution.test.ts
          README.md
          docs/development-status.md
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Run tests and preserve diagnostics
        id: tests
        shell: bash
        run: |
          set +e
          pnpm test 2>&1 | tee .tmp-managed-test.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build when tests pass
        if: steps.tests.outputs.rc == '0'
        run: pnpm build
      - name: Persist generated changes and remove temporary workflows
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/_tmp-finish-managed-tools-v2.yml .github/workflows/_tmp-persist-managed-tools.yml
          git add -A
          git commit -m 'feat: finish optional managed optimizer integration'
          git push origin HEAD:codex/managed-optimization-tools-v2
      - name: Fail if product tests failed
        if: steps.tests.outputs.rc != '0'
        run: exit 1
