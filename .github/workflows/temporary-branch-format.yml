name: Temporary branch formatter

on:
  push:
    branches:
      - fix/v019-routing-ui-rtk-linux

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/v019-routing-ui-rtk-linux
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - name: Commit exact Prettier output
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cli/src/commands/rtk-release-update.ts apps/cli/src/guided.ts apps/cli/test/guided-smart-routing.test.ts apps/cli/test/guided-update-check.test.ts tests/integration/update-command.test.ts
          git commit -m "style: apply repository Prettier"
          git push
