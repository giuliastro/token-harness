name: Temp apply verbosity milestone

on:
  push:
    branches:
      - feature/verbosity-quality-per-allowance

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/verbosity-quality-per-allowance
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/temp-apply-verbosity-milestone.mjs
      - run: pnpm exec prettier --write packages/core/src/domain/verbosity-learning.ts packages/core/src/domain/verbosity-quality-per-allowance.ts packages/core/src/domain/optimizer.ts packages/core/src/index.ts packages/core/test/verbosity-learning.test.ts packages/core/test/verbosity-quality-per-allowance.test.ts apps/cli/src/commands/optimize.ts apps/cli/src/commands/plan.ts PLAN.md
      - name: Commit integration and remove temporary scaffolding
        run: |
          git rm scripts/temp-apply-verbosity-milestone.mjs .github/workflows/temp-apply-verbosity-milestone.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: optimize verbosity by quality per allowance"
          git push origin HEAD:feature/verbosity-quality-per-allowance
