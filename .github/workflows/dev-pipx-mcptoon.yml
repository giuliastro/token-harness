name: Validate pipx mcptoon lifecycle

on:
  push:
    branches:
      - codex/candidate-managed-lifecycle

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/candidate-managed-lifecycle
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add reviewed pipx and mcptoon lifecycle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          install = Path('packages/core/src/state/install.ts')
          text = install.read_text()
          install_needle = """  pnpm: {
            executable: 'pnpm',
            args: (packageName, version) => [
              'add',
              '--global',
              version === null ? packageName : `${packageName}@${version}`,
            ],
            verified: false,
          },
          };"""
          install_replacement = """  pnpm: {
            executable: 'pnpm',
            args: (packageName, version) => [
              'add',
              '--global',
              version === null ? packageName : `${packageName}@${version}`,
            ],
            verified: false,
          },
          pipx: {
            executable: 'pipx',
            args: (packageName, version) => [
              'install',
              '--force',
              '--output',
              'json',
              version === null ? packageName : `${packageName}==${version}`,
            ],
            verified: true,
          },
          };"""
          if install_needle not in text:
              raise SystemExit('INSTALL_COMMANDS pnpm tail changed')
          text = text.replace(install_needle, install_replacement, 1)

          inventory_needle = """  pipx: {
            executable: 'pipx',
            args: () => ['list'],
            parse: (stdout, packageName) => {
              const pattern = new RegExp(`^\\\\s*${packageName}\\\\s+(\\\\S+)`, 'm');
              const match = pattern.exec(stdout);
              if (match === null) return { status: 'absent', version: null };
              const candidate = match[1] ?? '';
              if (parseSemanticVersion(candidate) === null) return { status: 'unknown', version: null };
              return { status: 'captured', version: candidate };
            },
            verified: false,
          },"""
          inventory_replacement = """  pipx: {
            executable: 'pipx',
            args: () => ['list', '--output', 'json'],
            parse: (stdout, packageName) => {
              let parsed: unknown;
              try {
                parsed = JSON.parse(stdout) as unknown;
              } catch {
                return { status: 'unknown', version: null };
              }
              if (typeof parsed !== 'object' || parsed === null || Array.isArray(parsed)) {
                return { status: 'unknown', version: null };
              }
              const venvs = (parsed as Record<string, unknown>)['venvs'];
              if (typeof venvs !== 'object' || venvs === null || Array.isArray(venvs)) {
                return { status: 'unknown', version: null };
              }
              const normalize = (value: string): string => value.toLowerCase().replace(/[-_.]+/g, '-');
              const wanted = normalize(packageName);
              for (const [environment, raw] of Object.entries(venvs as Record<string, unknown>)) {
                if (typeof raw !== 'object' || raw === null || Array.isArray(raw)) continue;
                const metadata = (raw as Record<string, unknown>)['metadata'];
                if (typeof metadata !== 'object' || metadata === null || Array.isArray(metadata)) continue;
                const main = (metadata as Record<string, unknown>)['main_package'];
                if (typeof main !== 'object' || main === null || Array.isArray(main)) continue;
                const record = main as Record<string, unknown>;
                const observedName = typeof record['package'] === 'string' ? record['package'] : environment;
                if (normalize(observedName) !== wanted && normalize(environment) !== wanted) continue;
                const candidate = record['package_version'];
                if (typeof candidate !== 'string' || parseSemanticVersion(candidate) === null) {
                  return { status: 'unknown', version: null };
                }
                return { status: 'captured', version: candidate };
              }
              return { status: 'absent', version: null };
            },
            verified: true,
          },"""
          if inventory_needle not in text:
              raise SystemExit('pipx inventory block changed')
          text = text.replace(inventory_needle, inventory_replacement, 1)
          install.write_text(text)

          managed = Path('packages/adapters/src/providers/mcptoon-managed.ts')
          text = managed.read_text()
          text = text.replace(
              "export const MCPTOON_MANAGED_MINIMUM_VERSION = '0.7.8';\n",
              "export const MCPTOON_MANAGED_MINIMUM_VERSION = '0.7.8';\nexport const MCPTOON_REVIEWED_INSTALL_VERSION = '0.7.10';\n",
              1,
          )
          helper_anchor = 'function directoryAction(harness: HarnessId, path: string, index: number): PlannedAction {'
          if helper_anchor not in text:
              raise SystemExit('mcptoon helper anchor changed')
          helper = """function mcptoonInstallAction(): PlannedAction {
            return {
              kind: 'package-manager-install',
              id: `mcptoon:install:${MCPTOON_REVIEWED_INSTALL_VERSION}`,
              riskClass: 'delegated',
              requiresNetwork: true,
              requiresElevation: false,
              affectedPaths: [],
              affectedProcesses: ['pipx'],
              preconditions: ['pipx is available and the reviewed mcptoon release is still installable'],
              postconditions: [`mcptoon ${MCPTOON_REVIEWED_INSTALL_VERSION} is runnable`],
              rollbackData: 'package-inventory',
              explanation: `Install reviewed mcptoon ${MCPTOON_REVIEWED_INSTALL_VERSION} in an isolated pipx environment`,
              packageManager: 'pipx',
              packageName: 'mcptoon',
              version: MCPTOON_REVIEWED_INSTALL_VERSION,
            };
          }

          """
          text = text.replace(helper_anchor, helper + helper_anchor, 1)
          old_doc = """/**
           * Plan only the reversible agent-instruction activation. Package installation is deliberately not
           * hidden here: the current package executor does not yet implement pipx installation, so an absent
           * mcptoon CLI remains a blocked prerequisite rather than an action that would fail at apply time.
           */"""
          new_doc = """/**
           * Plan the reviewed mcptoon lifecycle slice without touching MCP configuration.
           *
           * A missing CLI is installed through the generic pipx package transaction first, then the narrow
           * Claude/Codex instruction surface is applied. Existing but incompatible builds remain user-owned:
           * Token Harness does not replace a runnable third-party installation merely because it is old.
           */"""
          if old_doc not in text:
              raise SystemExit('mcptoon plan doc changed')
          text = text.replace(old_doc, new_doc, 1)

          start_marker = '  const observation = await observeMcptoonCandidate(context);\n'
          start = text.index(start_marker, text.index('export async function planMcptoonManagedActivation'))
          end_marker = "\n  return harness === 'claude'\n    ? planClaudeActivation(context, harness)\n    : planCodexActivation(context, harness);"
          end = text.index(end_marker, start) + len(end_marker)
          replacement = """  const observation = await observeMcptoonCandidate(context);
            const activation =
              harness === 'claude'
                ? await planClaudeActivation(context, harness)
                : await planCodexActivation(context, harness);

            if (observation.state === 'benchmark-ready') return activation;

            if (observation.state === 'absent') {
              return {
                ...activation,
                actions: [mcptoonInstallAction(), ...activation.actions],
                diagnostics: [
                  ...activation.diagnostics,
                  diagnostic({
                    severity: 'info',
                    code: 'mcptoon-managed-install-planned',
                    subject: harness,
                    message: `mcptoon is absent; the plan installs reviewed ${MCPTOON_REVIEWED_INSTALL_VERSION} through pipx before enabling agent guidance`,
                    remediation: null,
                  }),
                ],
              };
            }

            return {
              harness,
              target: null,
              actions: [],
              diagnostics: [
                diagnostic({
                  severity: 'warning',
                  code: 'mcptoon-managed-prerequisite',
                  subject: harness,
                  message: `mcptoon ${observation.version ?? ''} is runnable but not on the reviewed managed-activation surface`.trim(),
                  remediation: `Keep the existing installation user-owned, or move to mcptoon ${MCPTOON_MANAGED_MINIMUM_VERSION} or newer with the reviewed manifest surfaces`,
                }),
              ],
            };"""
          text = text[:start] + replacement + text[end:]
          managed.write_text(text)

          index = Path('packages/adapters/src/providers/index.ts')
          text = index.read_text()
          text = text.replace(
              '  MCPTOON_MANAGED_MINIMUM_VERSION,\n',
              '  MCPTOON_MANAGED_MINIMUM_VERSION,\n  MCPTOON_REVIEWED_INSTALL_VERSION,\n',
              1,
          )
          index.write_text(text)

          test = Path('packages/adapters/test/mcptoon-managed.test.ts')
          text = test.read_text()
          text = text.replace(
              '  MCPTOON_MARKER_END,\n',
              '  MCPTOON_MARKER_END,\n  MCPTOON_REVIEWED_INSTALL_VERSION,\n',
              1,
          )
          text += """

test('plans reviewed pipx installation before Codex guidance when mcptoon is absent', async () => {
  const fs = new MemoryFs();
  const base = context(fs);
  const absentRunner: ProcessRunner = {
    run: (request) =>
      Promise.resolve({
        displayCommand: `${request.executable} ${request.args.join(' ')}`,
        interpreter: 'direct',
        executablePath: null,
        exitCode: null,
        signal: null,
        stdout: '',
        stderr: '',
        stdoutTruncated: false,
        stderrTruncated: false,
        durationMs: 1,
        timedOut: false,
        failure: { reason: 'executable-not-found', message: 'mcptoon missing' },
      }),
  };
  const plan = await planMcptoonManagedActivation(
    { ...base, runner: absentRunner },
    harnessId('codex'),
  );

  assert.equal(plan.actions.length, 2);
  const install = plan.actions[0];
  assert.ok(install?.kind === 'package-manager-install');
  assert.equal(install.packageManager, 'pipx');
  assert.equal(install.packageName, 'mcptoon');
  assert.equal(install.version, MCPTOON_REVIEWED_INSTALL_VERSION);
  assert.equal(install.rollbackData, 'package-inventory');
  assert.equal(plan.actions[1]?.kind, 'patch-marker-block');
  assert.ok(plan.diagnostics.some((entry) => entry.code === 'mcptoon-managed-install-planned'));
});
"""
          test.write_text(text)

          pipx_test = Path('packages/core/test/pipx-install.test.ts')
          pipx_test.write_text("""import assert from 'node:assert/strict';
          import { describe, it } from 'node:test';

          import {
            knownPackageManagers,
            queryPackageInventory,
            runPackageManagerInstall,
            type PackageManagerInstallAction,
            type ProcessOutcome,
            type ProcessRunner,
          } from '../src/index.js';

          function action(version: string | null): PackageManagerInstallAction {
            return {
              kind: 'package-manager-install',
              id: 'pipx-mcptoon-install',
              riskClass: 'delegated',
              requiresNetwork: true,
              requiresElevation: false,
              affectedPaths: [],
              affectedProcesses: ['pipx'],
              preconditions: [],
              postconditions: [],
              rollbackData: 'package-inventory',
              explanation: 'Install mcptoon through pipx',
              packageManager: 'pipx',
              packageName: 'mcptoon',
              version,
            };
          }

          function runner(stdout = ''): { commands: string[]; runner: ProcessRunner } {
            const commands: string[] = [];
            return {
              commands,
              runner: {
                run(request): Promise<ProcessOutcome> {
                  commands.push(`${request.executable} ${request.args.join(' ')}`);
                  return Promise.resolve({
                    displayCommand: `${request.executable} ${request.args.join(' ')}`,
                    interpreter: 'direct',
                    executablePath: `/usr/bin/${request.executable}`,
                    exitCode: 0,
                    signal: null,
                    stdout,
                    stderr: '',
                    stdoutTruncated: false,
                    stderrTruncated: false,
                    durationMs: 1,
                    timedOut: false,
                    failure: null,
                  });
                },
              },
            };
          }

          describe('pipx package lifecycle', () => {
            it('uses an isolated exact-version install without shell interpolation', async () => {
              const process = runner();
              const result = await runPackageManagerInstall({
                action: action('0.7.10'),
                runner: process.runner,
                cwd: '/work',
              });
              assert.equal(result.status, 'installed');
              assert.deepEqual(process.commands, [
                'pipx install --force --output json mcptoon==0.7.10',
              ]);
              assert.equal(knownPackageManagers().includes('pipx'), true);
              assert.equal(
                result.diagnostics.some((entry) => entry.code === 'install-channel-unverified'),
                false,
              );
            });

            it('reads current pipx JSON inventory for rollback capture', async () => {
              const stdout = JSON.stringify({
                pipx_spec_version: '0.1',
                venvs: {
                  mcptoon: {
                    metadata: {
                      main_package: {
                        package: 'mcptoon',
                        package_version: '0.7.10',
                      },
                    },
                  },
                },
              });
              const process = runner(stdout);
              const result = await queryPackageInventory({
                channel: 'pipx',
                packageName: 'mcptoon',
                runner: process.runner,
                cwd: '/work',
              });
              assert.equal(result.status, 'captured');
              assert.equal(result.version, '0.7.10');
              assert.deepEqual(process.commands, ['pipx list --output json']);
              assert.equal(
                result.diagnostics.some((entry) => entry.code === 'inventory-query-unverified'),
                false,
              );
            });

            it('treats a valid pipx snapshot without the package as absent', async () => {
              const process = runner(JSON.stringify({ pipx_spec_version: '0.1', venvs: {} }));
              const result = await queryPackageInventory({
                channel: 'pipx',
                packageName: 'mcptoon',
                runner: process.runner,
                cwd: '/work',
              });
              assert.equal(result.status, 'absent');
              assert.equal(result.version, null);
            });
          });
          """)
          PY
      - name: Format changed sources
        run: >-
          pnpm exec prettier --write
          packages/core/src/state/install.ts
          packages/core/test/pipx-install.test.ts
          packages/adapters/src/providers/mcptoon-managed.ts
          packages/adapters/src/providers/index.ts
          packages/adapters/test/mcptoon-managed.test.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Live pipx mcptoon 0.7.10 smoke
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pipx
          export PIPX_HOME="$RUNNER_TEMP/pipx-home"
          export PIPX_BIN_DIR="$RUNNER_TEMP/pipx-bin"
          mkdir -p "$PIPX_HOME" "$PIPX_BIN_DIR"
          pipx install --force --output json 'mcptoon==0.7.10'
          "$PIPX_BIN_DIR/mcptoon" --version
          "$PIPX_BIN_DIR/mcptoon" manifest --help | grep -- '--compact'
          pipx list --output json | python -c "import json,sys; d=json.load(sys.stdin); assert d['venvs']['mcptoon']['metadata']['main_package']['package_version']=='0.7.10'"
      - name: Commit validated lifecycle changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/core/src/state/install.ts \
            packages/core/test/pipx-install.test.ts \
            packages/adapters/src/providers/mcptoon-managed.ts \
            packages/adapters/src/providers/index.ts \
            packages/adapters/test/mcptoon-managed.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "feat: add reviewed pipx lifecycle for mcptoon"
            git push origin HEAD:codex/candidate-managed-lifecycle
          fi
