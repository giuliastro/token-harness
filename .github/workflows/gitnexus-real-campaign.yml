name: GitNexus real Claude campaign

on:
  workflow_dispatch:
    inputs:
      model:
        description: Claude model for the paired campaign
        required: true
        default: haiku
        type: choice
        options:
          - haiku
          - sonnet
      max_attempts:
        description: Maximum attempts per baseline/optimized variant
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'

permissions:
  contents: read

concurrency:
  group: gitnexus-real-campaign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  campaign:
    name: Claude 2.1.269 + GitNexus 1.6.12
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GITNEXUS_CAMPAIGN_ARTIFACT_DIR: artifacts/gitnexus-real-campaign
      GITNEXUS_CAMPAIGN_MODEL: ${{ inputs.model }}
      GITNEXUS_CAMPAIGN_MAX_ATTEMPTS: ${{ inputs.max_attempts }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          # Evaluation-only runtime: GitNexus 1.6.12 requires ^22.18.0 or >=24.11.0.
          # Ordinary Token Harness CI intentionally remains on the supported floor 22.13.0.
          node-version: '22.18.0'
          cache: pnpm

      - name: Install Token Harness dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Token Harness
        run: pnpm build

      - name: Install exact evaluation tools without sudo
        shell: bash
        run: |
          set -euo pipefail
          campaign_home="$RUNNER_TEMP/gitnexus-campaign-home"
          campaign_tools="$RUNNER_TEMP/gitnexus-campaign-tools"
          mkdir -p "$campaign_home" "$campaign_tools"
          npm install --global --prefix "$campaign_tools" \
            @anthropic-ai/claude-code@2.1.269 \
            gitnexus@1.6.12
          echo "$campaign_tools/bin" >> "$GITHUB_PATH"

      - name: Run paired real campaign
        id: campaign
        continue-on-error: true
        shell: bash
        env:
          HOME: ${{ runner.temp }}/gitnexus-campaign-home
        run: |
          set -euo pipefail
          node scripts/evaluation/gitnexus-real-campaign.mjs

      - name: Upload sanitized campaign evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitnexus-real-campaign-${{ github.sha }}
          path: artifacts/gitnexus-real-campaign
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce campaign result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.campaign.outcome }}" != "success" ]; then
            echo "GitNexus real campaign failed or stopped at a fail-closed precondition." >&2
            exit 1
          fi
