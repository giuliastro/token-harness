name: mcptoon lifecycle bootstrap fixer

on:
  push:
    branches:
      - mcptoon-managed-lifecycle

permissions:
  contents: write

jobs:
  fix-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix bootstrap ordering and hand off
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/mcptoon-managed-lifecycle-bootstrap.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace("    if: ${{ github.actor != 'github-actions[bot]' }}\n", '')
          text = text.replace('          cache: pnpm\n', '')
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/mcptoon-managed-lifecycle-bootstrap-fix.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ci: repair mcptoon lifecycle bootstrap"
          git push origin HEAD:mcptoon-managed-lifecycle
