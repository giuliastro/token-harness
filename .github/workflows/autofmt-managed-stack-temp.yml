name: Temporary managed-stack autofmt

on:
  push:
    branches:
      - feat/managed-stack-combination-review

permissions:
  contents: write

jobs:
  format:
    if: "${{ !contains(github.event.head_commit.message, 'chore: apply prettier to managed-stack review') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/managed-stack-combination-review
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/core/src/metrics/optimization-stack.ts packages/core/test/optimization-stack.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/src/metrics/optimization-stack.ts packages/core/test/optimization-stack.test.ts
          git commit -m "chore: apply prettier to managed-stack review"
          git push origin HEAD:feat/managed-stack-combination-review
