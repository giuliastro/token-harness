      - name: Commit product changes and remove temporary workflow
        shell: bash
        run: |
          test -n "$(git status --porcelain)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/_tmp-finish-managed-tools.yml
          git add -A
          git commit -m 'feat: integrate optional managed mcptoon and GitNexus lifecycle'
          git push origin HEAD:codex/managed-optimization-tools
