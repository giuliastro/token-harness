name: Headroom candidate smoke

on:
  pull_request:
    paths:
      - '.github/workflows/headroom-candidate-smoke.yml'
      - 'packages/adapters/src/providers/headroom-candidate.ts'
      - 'packages/adapters/test/headroom-candidate.test.ts'
      - 'docs/candidates/headroom.md'
      - 'docs/candidates/benchmarking.md'
      - 'docs/candidates/promotion-readiness.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  passive-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install exact reviewed Headroom build
        shell: bash
        run: python -m pip install --disable-pip-version-check 'headroom-ai[proxy]==0.37.0'

      - name: Verify passive CLI contract
        shell: bash
        run: |
          set -euo pipefail
          version="$(headroom --version 2>&1)"
          help="$(headroom wrap --help 2>&1)"

          printf '%s\n' "$version"
          printf '%s\n' "$help"

          grep -Eq '(^|[^0-9])0\.37\.0([^0-9]|$)' <<<"$version"
          grep -Eiq '(^|[^[:alnum:]-])claude([^[:alnum:]-]|$)' <<<"$help"
          grep -Eiq '(^|[^[:alnum:]-])codex([^[:alnum:]-]|$)' <<<"$help"

      - name: Guard against active-wrap smoke
        shell: bash
        run: |
          echo 'This workflow intentionally stops at --version and wrap --help.'
          echo 'It must not launch wrap/unwrap/proxy commands or mutate harness configuration.'
