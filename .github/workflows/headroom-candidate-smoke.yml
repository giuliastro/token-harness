name: Headroom passive compatibility smoke

on:
  pull_request:
    paths:
      - '.github/workflows/headroom-candidate-smoke.yml'
      - 'packages/adapters/src/providers/headroom-candidate.ts'
      - 'packages/adapters/src/providers/headroom-managed.ts'
      - 'packages/adapters/src/providers/headroom-provider.ts'
      - 'packages/adapters/test/headroom-candidate.test.ts'
      - 'packages/adapters/test/headroom-managed.test.ts'
      - 'docs/candidates/headroom.md'
      - 'docs/candidates/benchmarking.md'
      - 'docs/candidates/promotion-readiness.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  passive-compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install exact reviewed Headroom MCP build
        shell: bash
        run: python -m pip install --disable-pip-version-check 'headroom-ai[mcp]==0.37.0'

      - name: Verify passive managed MCP CLI contract
        shell: bash
        run: |
          set -euo pipefail
          version="$(headroom --version 2>&1)"
          mcp_help="$(headroom mcp serve --help 2>&1)"

          printf '%s\n' "$version"
          printf '%s\n' "$mcp_help"

          grep -Eq '(^|[^0-9])0\.37\.0([^0-9]|$)' <<<"$version"
          grep -Eiq 'serve|server|mcp' <<<"$mcp_help"

      - name: Guard against active server smoke
        shell: bash
        run: |
          echo 'This workflow intentionally stops at --version and mcp serve --help.'
          echo 'It must not launch the MCP server, wrap/proxy commands, model calls, or mutate harness configuration.'
