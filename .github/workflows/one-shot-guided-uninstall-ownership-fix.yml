name: One-shot guided uninstall ownership fix

on:
  push:
    branches: [feat/guided-component-uninstall]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/guided-component-uninstall
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: pnpm
      - name: Refine ownership affordance
        run: python3 scripts/one-shot-guided-uninstall-ownership-fix.py
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Commit validated refinement and remove staging files
        shell: bash
        run: |
          rm .github/workflows/one-shot-guided-uninstall-ownership-fix.yml scripts/one-shot-guided-uninstall-ownership-fix.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(ui): scope removal to recorded ownership"
          git push origin HEAD:feat/guided-component-uninstall
