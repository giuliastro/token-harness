name: One-shot guided uninstall ownership fix

on:
  push:
    branches: [feat/guided-component-uninstall]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/guided-component-uninstall
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: pnpm
      - name: Refine ownership affordance
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('apps/cli/src/guided-stack-client.ts')
          text = path.read_text()
          old = """    if (component.managedByTokenHarness) {
      const remove = node('button', 'Remove managed integration', 'secondary');
      remove.type = 'button';
      remove.dataset.operation = 'remove';
      remove.addEventListener('click', () =>
        window.dispatchEvent(
          new CustomEvent('token-harness:remove-provider', {
            detail: { provider: component.providerId },
          }),
        ),
      );
      details.append(remove);
    } else if (component.configured) {
      details.append(
        node(
          'p',
          'This integration is not owned by Token Harness, so this dashboard will not remove it.',
          'caption',
        ),
      );
    }
"""
          new = """    if (component.managedByTokenHarness || component.configured) {
      const remove = node(
        'button',
        component.managedByTokenHarness
          ? 'Remove managed integration'
          : 'Check removable managed changes',
        'secondary',
      );
      remove.type = 'button';
      remove.dataset.operation = 'remove';
      remove.addEventListener('click', () =>
        window.dispatchEvent(
          new CustomEvent('token-harness:remove-provider', {
            detail: { provider: component.providerId },
          }),
        ),
      );
      details.append(remove);
      if (!component.managedByTokenHarness)
        details.append(
          node(
            'p',
            'The provider installation is user-owned. This check can only remove configuration changes that Token Harness previously recorded as its own.',
            'caption',
          ),
        );
    }
"""
          if text.count(old) != 1:
              raise SystemExit('guided-stack-client ownership block did not match exactly once')
          path.write_text(text.replace(old, new))

          test = Path('apps/cli/test/guided-component-uninstall.test.ts')
          text = test.read_text()
          old = """  assert.match(GUIDE_STACK_JS, /component\\.managedByTokenHarness/);
  assert.match(GUIDE_STACK_JS, /token-harness:remove-provider/);
"""
          new = """  assert.match(
    GUIDE_STACK_JS,
    /component\\.managedByTokenHarness \\|\\| component\\.configured/,
  );
  assert.match(GUIDE_STACK_JS, /provider installation is user-owned/);
  assert.match(GUIDE_STACK_JS, /token-harness:remove-provider/);
"""
          if text.count(old) != 1:
              raise SystemExit('guided uninstall static assertion block did not match exactly once')
          test.write_text(text.replace(old, new))
          PY
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Commit validated refinement and remove workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-guided-uninstall-ownership-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(ui): scope removal to recorded ownership"
          git push origin HEAD:feat/guided-component-uninstall
