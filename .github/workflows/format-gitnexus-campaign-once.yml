name: Format GitNexus campaign once

on:
  push:
    branches:
      - codex/gitnexus-managed-campaign-orchestration
    paths:
      - .github/workflows/format-gitnexus-campaign-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/gitnexus-managed-campaign-orchestration
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/cli/test/candidate-benchmark-campaign.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cli/test/candidate-benchmark-campaign.test.ts
          git diff --cached --check
          git commit -m "style(gitnexus): format campaign orchestration test"
          git push origin HEAD:codex/gitnexus-managed-campaign-orchestration
