name: Landing page

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'scripts/download-stats.mjs'
      - 'scripts/prepare-landing.mjs'
      - 'tests/tools/download-stats.test.mjs'
      - 'tests/tools/landing-contact.test.mjs'
      - '.github/workflows/download-stats.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'scripts/download-stats.mjs'
      - 'scripts/prepare-landing.mjs'
      - 'tests/tools/download-stats.test.mjs'
      - 'tests/tools/landing-contact.test.mjs'
      - '.github/workflows/download-stats.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate the static landing
        run: |
          test -s site/index.html
          node --check site/site.js
          node --test tests/tools/download-stats.test.mjs
          node --test tests/tools/landing-contact.test.mjs
      - name: Prepare public contact configuration
        env:
          CONTACT_FORM_ENDPOINT: ${{ vars.CONTACT_FORM_ENDPOINT }}
        run: node scripts/prepare-landing.mjs
      - name: Upload static site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/landing

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
