name: tmp-agent-native-finalize

on:
  push:
    branches:
      - feature/agent-native-skill

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/agent-native-skill
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node .tmp-agent-native-finalize.mjs
      - run: >-
          pnpm exec prettier --write
          skills/token-harness/SKILL.md
          tests/integration/agent-skill.test.ts
          docs/rfcs/0022-agent-native-skill.md
          README.md
          PLAN.md
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills/token-harness/SKILL.md tests/integration/agent-skill.test.ts docs/rfcs/0022-agent-native-skill.md README.md PLAN.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: finalize agent-native Token Harness skill"
            git push origin HEAD:feature/agent-native-skill
          fi
