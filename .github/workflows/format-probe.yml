name: Format probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show exact Prettier diff
        shell: bash
        run: |
          pnpm exec prettier --write apps/cli/src/commands/candidate-campaign-surface.ts
          git diff -- apps/cli/src/commands/candidate-campaign-surface.ts
