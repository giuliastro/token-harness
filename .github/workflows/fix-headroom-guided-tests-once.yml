name: Fix Headroom guided tests once

on:
  push:
    branches:
      - codex/managed-optimization-tools-v2
    paths:
      - .github/workflows/fix-headroom-guided-tests-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/managed-optimization-tools-v2
      - name: Inspect stale Headroom expectations
        shell: bash
        run: |
          echo '--- candidate occurrences ---'
          grep -n -C 5 'candidate' apps/cli/test/guided.test.ts || true
          echo '--- Headroom occurrences ---'
          grep -n -C 8 -i 'headroom' apps/cli/test/guided.test.ts || true
          exit 1
