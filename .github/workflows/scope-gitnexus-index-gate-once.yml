name: Scope GitNexus index gate once

on:
  push:
    branches:
      - codex/gitnexus-index-readiness-gate
    paths:
      - .github/workflows/scope-gitnexus-index-gate-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/gitnexus-index-readiness-gate
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node .github/scripts/scope-gitnexus-index-gate-once.mjs
      - run: pnpm exec prettier --write apps/cli/src/commands/candidate-campaign-surface.ts apps/cli/src/commands/gitnexus-candidate-lifecycle.ts
      - run: pnpm typecheck
      - run: pnpm test
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cli/src/commands/candidate-campaign-surface.ts apps/cli/src/commands/gitnexus-candidate-lifecycle.ts
          git diff --cached --check
          git commit -m "fix(gitnexus): scope index readiness to campaign starts"
          git push origin HEAD:codex/gitnexus-index-readiness-gate
