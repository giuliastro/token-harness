# Builds, attests, publishes and releases the exact `token-harness` artifact after release gates pass — PLAN §8.3.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (used for safe release recovery)
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify and publish release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v5
        with:
          # A manual recovery run executes the trusted workflow from the default branch while
          # rebuilding the exact immutable tag supplied by the operator.
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          # npm Trusted Publishing requires Node >=22.14 and npm >=11.5.1. Release jobs use a
          # current LTS runtime while CI continues to test the lower supported product floor.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # Release publishing must not restore package-manager state that could carry auth.
          package-manager-cache: false

      - name: Pin npm Trusted Publishing floor
        run: npm install --global npm@11.5.1

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Release-blocking real-machine gate for the exact guided paths users click. This installs
      # public HarnessTrim 0.2.1 plus current Claude Code/Codex in an isolated HOME, runs guided
      # Finish setup for both agents, updates HarnessTrim through the guided approval flow, verifies
      # the active PATH runtime, removes one integration and reconnects it on the latest release.
      - name: Guided real-runtime setup and update smoke
        run: node scripts/evaluation/harnesstrim-guided-live-smoke.mjs

      - name: Bundle smoke test
        run: pnpm smoke

      - name: Stage the publishable package
        run: pnpm package

      - name: Install smoke test
        run: pnpm smoke:install

      - name: Refuse a tag that does not match the staged version
        run: node scripts/check-release-tag.mjs "$RELEASE_TAG"

      - name: Pack the exact release artifact
        run: |
          mkdir -p dist/release
          npm pack ./dist/package --pack-destination dist/release --loglevel error
          test "$(find dist/release -maxdepth 1 -name '*.tgz' -type f | wc -l)" -eq 1

      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/release/*.tgz

      - name: Attest the shipped SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/release/*.tgz
          sbom-path: dist/package/sbom.json

      - name: Keep the attested tarball
        uses: actions/upload-artifact@v4
        with:
          name: token-harness-${{ inputs.tag || github.ref_name }}
          path: dist/release/*.tgz
          if-no-files-found: error

      - name: Decide whether npm needs this version
        id: npm
        shell: bash
        run: |
          version="$(node -p "require('./dist/package/package.json').version")"
          name="$(node -p "require('./dist/package/package.json').name")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; publish is idempotently skipped"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$name@$version is not on npm yet"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Remove setup-node token auth shim before OIDC publish
        if: steps.npm.outputs.publish == 'true'
        shell: bash
        run: |
          # setup-node's registry-url support writes an _authToken placeholder into its temporary
          # npmrc. npm can interpret that as classic token auth and skip the OIDC exchange. Keep the
          # registry selection, but replace the generated file with a credential-free npmrc.
          if [ -z "${NPM_CONFIG_USERCONFIG:-}" ]; then
            echo "::error::setup-node did not expose its npm user config path"
            exit 1
          fi
          printf '%s\n' 'registry=https://registry.npmjs.org/' > "$NPM_CONFIG_USERCONFIG"
          if grep -q '_authToken' "$NPM_CONFIG_USERCONFIG"; then
            echo "::error::npm user config still contains token authentication"
            exit 1
          fi

      - name: Publish to npm with trusted publishing
        if: steps.npm.outputs.publish == 'true'
        working-directory: dist/package
        # npm's OIDC helper logs token-exchange rejection reasons at verbose level without logging
        # the ID token itself. Keep this enabled so a failed trusted-publishing exchange is actionable.
        run: npm publish --loglevel verbose

      - name: Verify npm release is visible as latest
        shell: bash
        run: |
          version="$(node -p "require('./dist/package/package.json').version")"
          name="$(node -p "require('./dist/package/package.json').name")"
          published=""
          latest=""
          for attempt in $(seq 1 30); do
            published="$(npm view "$name@$version" version 2>/dev/null || true)"
            latest="$(npm view "$name" dist-tags.latest 2>/dev/null || true)"
            if [ "$published" = "$version" ] && [ "$latest" = "$version" ]; then
              echo "$name@$version is visible on npm and latest points to $version"
              exit 0
            fi
            echo "npm propagation pending (attempt $attempt/30): version=${published:-missing}, latest=${latest:-missing}"
            sleep 10
          done
          echo "::error::$name@$version did not become visible as npm latest after publish. observed version=${published:-missing}, latest=${latest:-missing}"
          exit 1

      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$RELEASE_TAG"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/release/*.tgz --clobber
          else
            gh release create "$tag" dist/release/*.tgz --verify-tag --generate-notes
          fi
