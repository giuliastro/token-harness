# Builds, attests, publishes and releases the exact `token-harness` artifact after release gates pass — PLAN §8.3.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (used for safe release recovery)
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify and publish release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v5
        with:
          # A manual recovery run executes the trusted workflow from the default branch while
          # rebuilding the exact immutable tag supplied by the operator.
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          # npm Trusted Publishing requires Node >=22.14 and npm >=11.5.1. Release jobs use a
          # current LTS runtime while CI continues to test the lower supported product floor.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Pin npm Trusted Publishing floor
        run: npm install --global npm@11.5.1

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle smoke test
        run: pnpm smoke

      - name: Stage the publishable package
        run: pnpm package

      - name: Install smoke test
        run: pnpm smoke:install

      - name: Refuse a tag that does not match the staged version
        run: node scripts/check-release-tag.mjs "$RELEASE_TAG"

      - name: Pack the exact release artifact
        run: |
          mkdir -p dist/release
          npm pack ./dist/package --pack-destination dist/release --loglevel error
          test "$(find dist/release -maxdepth 1 -name '*.tgz' -type f | wc -l)" -eq 1

      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/release/*.tgz

      - name: Attest the shipped SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/release/*.tgz
          sbom-path: dist/package/sbom.json

      - name: Keep the attested tarball
        uses: actions/upload-artifact@v4
        with:
          name: token-harness-${{ inputs.tag || github.ref_name }}
          path: dist/release/*.tgz
          if-no-files-found: error

      - name: Decide whether npm needs this version
        id: npm
        shell: bash
        run: |
          version="$(node -p "require('./dist/package/package.json').version")"
          name="$(node -p "require('./dist/package/package.json').name")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; publish is idempotently skipped"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$name@$version is not on npm yet"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish to npm with trusted publishing
        if: steps.npm.outputs.publish == 'true'
        working-directory: dist/package
        run: npm publish

      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$RELEASE_TAG"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/release/*.tgz --clobber
          else
            gh release create "$tag" dist/release/*.tgz --verify-tag --generate-notes
          fi
