# Publishes `token-harness` after the release gates pass — PLAN §8.3.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle smoke test
        run: pnpm smoke

      - name: Stage the publishable package
        run: pnpm package

      - name: Install smoke test
        run: pnpm smoke:install

      - name: Refuse a tag that does not match the staged version
        run: node scripts/check-release-tag.mjs "${{ github.ref_name }}"
