# Builds, attests, publishes and releases the exact `token-harness` artifact after release gates pass — PLAN §8.3.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify and publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle smoke test
        run: pnpm smoke

      - name: Stage the publishable package
        run: pnpm package

      - name: Install smoke test
        run: pnpm smoke:install

      - name: Refuse a tag that does not match the staged version
        run: node scripts/check-release-tag.mjs "${{ github.ref_name }}"

      - name: Pack the exact release artifact
        run: |
          mkdir -p dist/release
          npm pack ./dist/package --pack-destination dist/release --loglevel error
          test "$(find dist/release -maxdepth 1 -name '*.tgz' -type f | wc -l)" -eq 1

      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/release/*.tgz

      - name: Attest the shipped SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/release/*.tgz
          sbom-path: dist/package/sbom.json

      - name: Keep the attested tarball
        uses: actions/upload-artifact@v4
        with:
          name: token-harness-${{ github.ref_name }}
          path: dist/release/*.tgz
          if-no-files-found: error

      - name: Decide whether npm needs this version
        id: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          version="$(node -p "require('./dist/package/package.json').version")"
          name="$(node -p "require('./dist/package/package.json').name")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; publish is idempotently skipped"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN is required to publish $name@$version"
            exit 1
          fi
          echo "$name@$version is not on npm yet"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: steps.npm.outputs.publish == 'true'
        working-directory: dist/package
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/release/*.tgz --clobber
          else
            gh release create "$tag" dist/release/*.tgz --verify-tag --generate-notes
          fi
