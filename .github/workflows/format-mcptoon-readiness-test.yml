name: Format mcptoon readiness test
on:
  push:
    branches:
      - feat/mcptoon-usage-activation-witness
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/mcptoon-usage-activation-witness
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/cli/test/guided-mcptoon-activation-readiness.test.ts
      - run: rm .github/workflows/format-mcptoon-readiness-test.yml
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/cli/test/guided-mcptoon-activation-readiness.test.ts .github/workflows/format-mcptoon-readiness-test.yml
          git diff --cached --quiet || git commit -m "style: format mcptoon readiness test"
          git push origin HEAD:feat/mcptoon-usage-activation-witness
