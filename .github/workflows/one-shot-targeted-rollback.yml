name: One-shot targeted rollback primitive

on:
  push:
    branches:
      - feat/rollback-transaction-target

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/rollback-transaction-target
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: pnpm
      - name: Apply targeted rollback patch
        run: python3 scripts/one-shot-targeted-rollback.py
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Commit validated product changes
        shell: bash
        run: |
          rm .github/workflows/one-shot-targeted-rollback.yml scripts/one-shot-targeted-rollback.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(rollback): guard undo by transaction id"
          git push origin HEAD:feat/rollback-transaction-target
