name: Format mcptoon compatibility changes

on:
  push:
    branches:
      - codex/mcptoon-compatibility-promotion

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/mcptoon-compatibility-promotion

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format only the files reported by CI
        run: |
          pnpm exec prettier --write \
            packages/core/test/compatibility-rows.test.ts \
            tests/tools/mcptoon-row-lifecycle.mjs

      - name: Commit formatted files and remove this one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/format-mcptoon-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/core/test/compatibility-rows.test.ts tests/tools/mcptoon-row-lifecycle.mjs
          git diff --cached --check
          git commit -m 'style: format mcptoon compatibility changes'
          git push origin HEAD:codex/mcptoon-compatibility-promotion
