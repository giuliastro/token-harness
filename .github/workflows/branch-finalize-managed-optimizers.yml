name: Finalize managed optimizers

on:
  push:
    branches:
      - codex/managed-optimization-tools-v2

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/managed-optimization-tools-v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/.tmp-finalize-managed-optimizers.mjs
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Commit final polish
        run: |
          rm scripts/.tmp-finalize-managed-optimizers.mjs
          rm .github/workflows/branch-finalize-managed-optimizers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(ui): finalize optional optimizer lifecycle status"
          git push origin HEAD:codex/managed-optimization-tools-v2
