name: temporary format benchmark context test

on:
  push:
    branches:
      - feature/tool-deferral-benchmark

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/tool-deferral-benchmark
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/core/test/benchmark-context.test.ts docs/spikes/context-owner-candidates-2026-09-09.md
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/core/test/benchmark-context.test.ts docs/spikes/context-owner-candidates-2026-09-09.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format context benchmark evidence"
          git push origin HEAD:feature/tool-deferral-benchmark
