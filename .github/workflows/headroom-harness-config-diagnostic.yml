name: Headroom harness config diagnostic

on:
  push:
    branches:
      - codex/managed-optimization-tools-v2
    paths:
      - .github/workflows/headroom-harness-config-diagnostic.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
      - name: Install exact harness rows without running models
        run: npm install --global @anthropic-ai/claude-code@2.1.269 @openai/codex@0.153.0
      - name: Probe local MCP config readers only
        shell: bash
        run: |
          set +e
          echo '=== versions ==='
          claude --version
          codex --version
          echo '=== MCP help ==='
          claude mcp --help
          codex mcp --help

          tmp="$(mktemp -d)"
          export HOME="$tmp"
          cat > "$HOME/.claude.json" <<'JSON'
          {"mcpServers":{"headroom":{"command":"headroom","args":["mcp","serve"]}}}
          JSON
          mkdir -p "$HOME/.codex"
          cat > "$HOME/.codex/config.toml" <<'TOML'
          [mcp_servers.headroom]
          command = "headroom"
          args = ["mcp", "serve"]
          TOML

          echo '=== Claude local config lookup ==='
          claude mcp get headroom
          echo "claude_get_exit=$?"
          echo '=== Codex local config lookup ==='
          codex mcp get headroom
          echo "codex_get_exit=$?"
          echo 'No model prompt, API request, login, MCP server launch, or benchmark is performed by this diagnostic.'
